<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script>(function(){try{if(localStorage.getItem("trade.log:theme")==="light")document.documentElement.setAttribute("data-theme","light");}catch(e){}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="refresh" content="0; url=stats.html">
<title>Playbooks — trade.log</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="css/common.css">
<style>
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
  .redirect-box {
    position: relative; text-align: center; color: var(--text-dim); font-size: 14px; line-height: 1.55; max-width: 420px; margin: 24px; padding: 30px 28px 26px;
    background: var(--g-sheen, none), var(--g-fill-strong, var(--panel)); border: 1px solid var(--g-line, var(--border)); border-radius: 28px;
    -webkit-backdrop-filter: var(--g-blur, blur(24px)); backdrop-filter: var(--g-blur, blur(24px));
    box-shadow: inset 0 1px 0 var(--g-hi, rgba(255,255,255,.1)), 0 30px 70px -20px rgba(0,0,0,.5);
    animation: rdRise .5s cubic-bezier(.22,1,.36,1) backwards;
  }
  .redirect-box::before {
    content: ""; display: block; width: 34px; height: 34px; margin: 0 auto 16px; border-radius: 50%;
    border: 3px solid color-mix(in srgb, var(--primary) 22%, transparent); border-top-color: var(--primary);
    box-shadow: 0 0 20px -4px var(--primary); animation: rdSpin .9s linear infinite;
  }
  .redirect-box p { margin: 0 0 10px; text-wrap: pretty; }
  .redirect-box p:last-child { margin-bottom: 0; font-size: 12.5px; color: var(--text-faint); }
  .redirect-box a { color: var(--primary); text-underline-offset: 3px; }
  @keyframes rdSpin { to { transform: rotate(360deg); } }
  @keyframes rdRise { from { opacity: 0; transform: translateY(14px) scale(.985); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .redirect-box, .redirect-box::before { animation: none; } }
</style>
<link rel="stylesheet" href="css/buttons.css">
</head>
<body>
  <div class="redirect-box">
    <p>Playbooks' per-setup scorecard (win rate, trade count, net P&amp;L, most common lesson tag) now lives in the setup breakdown on the Performance page — this page has moved.</p>
    <p>Redirecting to <a href="stats.html">stats.html</a>…</p>
  </div>
  <script>window.location.replace("stats.html");</script>
</body>
</html>
