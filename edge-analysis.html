<html lang="en">
<head>
<script src="js/utils.js"></script>

<style>
  /* Edge Analysis — page-local styling */
  html { scroll-behavior: smooth; }

  /* ---- intro card ---- */
  .edge-intro {
    display: flex; gap: 16px; align-items: flex-start;
    padding: 18px 20px; margin-bottom: 16px;
    background: var(--glass, rgba(22,24,33,0.58));
    border: 1px solid var(--glass-border, var(--border-soft));
    border-radius: var(--radius-lg, 14px);
  }
  .edge-intro-icon {
    flex-shrink: 0; width: 38px; height: 38px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    background: var(--grad-signature, linear-gradient(120deg, #8457ff, #22d3ee));
    color: #fff;
  }
  .edge-intro-icon svg { width: 20px; height: 20px; }
  .edge-intro h2 { margin: 0 0 6px; font-size: 15px; font-weight: 700; font-family: var(--display, var(--sans)); }
  .edge-intro p { margin: 0; font-size: 12.5px; line-height: 1.6; color: var(--text-dim); max-width: 76ch; }

  /* ---- summary strip icons ---- */
  #edge-health .stat { cursor: default; }
  #edge-health .label-row { justify-content: space-between; }
  #edge-health .label-icon { width: 14px; height: 14px; color: var(--text-faint); flex-shrink: 0; }

  /* ---- sticky jump nav ---- */
  .edge-jumpnav {
    position: sticky; top: var(--topbar-h); z-index: 9;
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
    padding: 10px 12px; margin: 0 0 18px;
    background: var(--glass, rgba(22,24,33,0.82));
    backdrop-filter: blur(10px);
    border: 1px solid var(--glass-border, var(--border-soft));
    border-radius: var(--radius, 10px);
  }
  .edge-jumpnav .pill { cursor: pointer; user-select: none; display: inline-flex; align-items: center; gap: 6px; }
  .edge-jumpnav .pill .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: 0.5; }
  .edge-jumpnav .pill.active {
    background: var(--primary-soft, rgba(139,124,246,0.15));
    color: var(--primary, #8b7cf6);
    border-color: rgba(139,124,246,0.45);
    box-shadow: 0 0 0 1px rgba(139,124,246,0.25), 0 0 14px rgba(132,87,255,0.25);
  }

  /* ---- section head with icon ---- */
  .panel-box[id^="section-"] { scroll-margin-top: calc(var(--topbar-h) + 70px); }
  .edge-section-head { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
  .edge-section-icon {
    flex-shrink: 0; width: 26px; height: 26px; border-radius: 7px;
    display: flex; align-items: center; justify-content: center;
    background: var(--primary-soft); color: var(--primary);
  }
  .edge-section-icon svg { width: 14px; height: 14px; }
  .edge-section-head .title { font-size: 12.5px; text-transform: none; letter-spacing: 0; color: var(--text); font-weight: 700; }

  /* ---- explainer: blurb + expandable deep dive ---- */
  .edge-explain { margin: 8px 0 18px; }
  .edge-explain-blurb { font-size: 12.5px; line-height: 1.6; color: var(--text-dim); margin: 0 0 8px; max-width: 82ch; }
  .edge-explain-toggle {
    display: inline-flex; align-items: center; gap: 5px;
    background: none; border: none; cursor: pointer; padding: 0;
    font-family: var(--sans); font-size: 11.5px; font-weight: 600;
    color: var(--primary); letter-spacing: 0.02em;
  }
  .edge-explain-toggle:hover { color: var(--text); }
  .edge-explain-toggle .chevron { width: 12px; height: 12px; transition: transform 0.2s var(--ease, ease); }
  .edge-explain-toggle[aria-expanded="true"] .chevron { transform: rotate(180deg); }
  .edge-explain-body {
    margin-top: 10px; padding: 12px 14px;
    background: var(--panel-2); border: 1px solid var(--border-soft); border-radius: var(--radius-sm);
    font-size: 12px; line-height: 1.65; color: var(--text-dim);
  }
  .edge-explain-body p { margin: 0 0 8px; }
  .edge-explain-body p:last-child { margin-bottom: 0; }
  .edge-explain-body ul { margin: 0 0 8px; padding-left: 18px; }
  .edge-explain-body li { margin-bottom: 4px; }
  .edge-explain-body b { color: var(--text); }
  .edge-explain-body code { font-family: var(--mono); font-size: 11px; background: var(--panel-3); padding: 1px 5px; border-radius: 4px; }

  /* ---- generic edge row grid (replaces old per-row inline widths) ---- */
  .edge-row {
    display: grid; align-items: center; gap: 4px 12px;
    padding: 7px 4px; border-radius: 7px; font-size: 12.5px;
  }
  .edge-row[data-clickable] { cursor: pointer; }
  .edge-row[data-clickable]:hover { background: var(--panel-2); }
  .edge-row .c-label { color: var(--text); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .edge-row .c-bar { min-width: 60px; }
  .edge-row .c-num { text-align: right; font-family: var(--mono); font-size: 11.5px; white-space: nowrap; }
  .edge-row .c-flag { text-align: center; }

  .decay-row { grid-template-columns: 168px minmax(60px,1fr) 46px 128px 40px 116px; }
  .tag-row   { grid-template-columns: minmax(120px,200px) minmax(60px,1fr) 44px 64px 76px 38px; }
  .quint-row { grid-template-columns: 150px minmax(60px,1fr) 44px 104px 38px; }
  .size-row  { grid-template-columns: 140px minmax(60px,1fr) 44px 108px 76px 38px; }

  .decay-head {
    display: grid; grid-template-columns: 168px minmax(60px,1fr) 46px 128px 40px 116px; gap: 4px 12px;
    font-size: 10.5px; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.05em;
    margin-bottom: 6px; padding: 0 4px;
  }
  .decay-head span.sortable { cursor: pointer; user-select: none; display: flex; align-items: center; gap: 3px; }
  .decay-head span.sortable:hover { color: var(--text); }
  .decay-head .c-num, .decay-head .c-half { justify-content: flex-end; text-align: right; }
  .decay-head .sort-arrow { opacity: 0; font-size: 9px; }
  .decay-head span.sort-active .sort-arrow { opacity: 1; }

  @media (max-width: 700px) {
    .decay-row, .decay-head { grid-template-columns: 1fr 44px; }
    .decay-row .c-half, .decay-head .c-half { display: none; }
    .decay-row .c-bar { grid-column: 1 / -1; order: 3; }
    .decay-row .c-flag { grid-column: 1 / -1; order: 4; text-align: left; margin-top: 2px; }
    .tag-row, .quint-row, .size-row { grid-template-columns: 1fr 44px; }
    .tag-row .c-bar, .quint-row .c-bar, .size-row .c-bar { grid-column: 1 / -1; order: 3; }
    .tag-row .c-num.c-delta, .tag-row .c-num.c-pnl,
    .quint-row .c-num.c-range, .size-row .c-num.c-range, .size-row .c-num.c-pnl { display: none; }
    .edge-intro { flex-direction: column; }
  }

  #edge-content .bar-fill { transition: width 0.9s cubic-bezier(0.16,1,0.3,1); }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    #edge-content .bar-fill { transition: none; }
    .edge-explain-toggle .chevron { transition: none; }
  }
</style>
</head>
<body>

<script src="js/nav-render.js"></script>
