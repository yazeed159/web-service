<style>
  .rv-bar { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin:0 0 16px; }
  .rv-seg { display:inline-flex; padding:3px; gap:2px; border-radius:999px; border:1px solid var(--border); background:var(--panel-2); }
  .rv-seg button { font:inherit; font-size:12.5px; padding:6px 14px; border-radius:999px; border:0; background:transparent; color:var(--text-dim); cursor:pointer; min-height:34px; }
  .rv-seg button.on { background:var(--primary-soft); color:var(--primary); }
  .rv-nav { display:inline-flex; align-items:center; gap:6px; }
  .rv-nav button { font:inherit; min-height:36px; min-width:36px; border-radius:10px; border:1px solid var(--border); background:var(--panel-2); color:var(--text); cursor:pointer; }
  .rv-label { font-weight:600; min-width:9ch; text-align:center; }
  .rv-kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:16px; }
  .rv-kpi { padding:14px; border-radius:var(--radius); border:1px solid var(--border); background:var(--panel); }
  .rv-kpi span { display:block; font-size:12px; color:var(--text-dim); margin-bottom:4px; }
  .rv-kpi b { font-family:var(--mono); font-size:20px; font-weight:600; }
  .rv-kpi b.up { color:var(--green); } .rv-kpi b.down { color:var(--red); }
  .rv-kpi small { display:block; margin-top:3px; font-size:12px; color:var(--text-dim); }
  .rv-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:14px; }
  .rv-card { padding:16px; border-radius:var(--radius); border:1px solid var(--border); background:var(--panel); }
  .rv-card h2 { margin:0 0 10px; font-size:14px; font-weight:600; }
  .rv-row { display:flex; justify-content:space-between; gap:10px; padding:6px 0; font-size:13px; }
  .rv-row + .rv-row { border-top:1px solid var(--border-soft, var(--border)); }
  .rv-row .up { color:var(--green); } .rv-row .down { color:var(--red); }
  .rv-row .mono { font-family:var(--mono); }
  .rv-break { color:var(--red); }
  .rv-empty { padding:28px 8px; color:var(--text-dim); font-size:14px; }
  .rv-days { display:flex; gap:6px; align-items:flex-end; height:70px; margin-top:6px; }
  .rv-day { flex:1; display:flex; flex-direction:column; justify-content:flex-end; align-items:center; gap:3px; font-size:10.5px; color:var(--text-dim); min-width:0; }
  .rv-day i { display:block; width:100%; max-width:22px; border-radius:4px 4px 0 0; background:var(--green); }
  .rv-day i.neg { background:var(--red); }
</style>
