<!DOCTYPE html>
<html lang="en">
<head>
<script src="js/utils.js"></script>
<script src="js/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/auth.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Patterns — trade.log</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="css/common.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="modernGaugeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8457ff"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="modernEquityGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8457ff"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
</svg>


<div class="app-shell">

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-top">
      <a href="index.html" class="brand">
        <span class="mark">T</span>
        <span class="name">trade<span class="muted">.log</span></span>
      </a>
      <button class="sidebar-toggle" id="sidebar-toggle" title="Collapse sidebar" aria-label="Collapse sidebar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
      </button>
    </div>

    <nav class="sidebar-nav">
      <div id="sidebar-main-section"></div>


      <div id="sidebar-more-section"></div>
<script src="js/nav-render.js"></script>
</nav>

    <div class="sidebar-bottom">
      <div class="pipeline-status"><span class="dot"></span><span>Patterns</span></div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="topbar-left">
        <h1 id="page-title">Recurring patterns</h1>
      </div>
      <div class="topbar-right">
        <button class="icon-btn" id="mobile-nav-btn" title="Menu" aria-label="Open menu">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
        </button>
      </div>
    </header>

    <div class="content">
      <div class="panel-head">
        <div class="sub">Every trade's lessons are tagged (e.g. <span class="mono">chased_extension</span>, <span class="mono">late_exit</span>). This clusters them so a mistake repeated across many trades stands out instead of getting buried in individual verdicts.</div>
      </div>

      <div id="patterns-content">
        <div class="loading-line">Loading…</div>
      </div>
    </div>

    <div class="footer">trade.log — generated from data/trades.json</div>
  </div>
</div>

<script>
(function () {
  "use strict";
  const content = document.getElementById("patterns-content");

  window.fetchTradesIndex()
    .then((rows) => render(Array.isArray(rows) ? rows : []))
    .catch((err) => {
      content.innerHTML = `<div class="empty-state">Couldn't load your trades (${escapeHtml(String(err.message))}).</div>`;
    });

  // escapeHtml() now in utils.js (loads first on every page).

  // tradeListItemHtml/tradeListMoreHtml/tradeListHtml/
  // TRADE_LIST_PAGE_SIZE/tradeListState now in utils.js.

  // ---------- URL state (see NavState in nav.js) ----------
  // Tags are keyed by name (stable across reloads, unlike a running
  // counter), so which tag rows are expanded -- and how far "Load more"
  // was clicked within each -- round-trips through the URL the same
  // way. Back from trade.html then reopens exactly what was open
  // instead of collapsing everything back to the default view.
  const openTags = new Set();
  function syncUrlState() {
    const shownObj = {};
    openTags.forEach((tag) => {
      const state = tradeListState.get("tag-list-" + escapeHtml(tag));
      if (state && state.shown > TRADE_LIST_PAGE_SIZE) shownObj[tag] = state.shown;
    });
    NavState.set({
      open: openTags.size ? JSON.stringify(Array.from(openTags)) : null,
      shown: Object.keys(shownObj).length ? JSON.stringify(shownObj) : null,
    });
  }
  // Re-opens whichever tag rows were expanded (and re-loads however many
  // rows had been paged into them) based on the URL, once per boot.
  function restoreUrlState() {
    let openArr = [];
    let shownObj = {};
    try { openArr = JSON.parse(NavState.get("open", "[]")) || []; } catch (e) { /* malformed/old URL, ignore */ }
    try { shownObj = JSON.parse(NavState.get("shown", "{}")) || {}; } catch (e) { /* malformed/old URL, ignore */ }
    openArr.forEach((tag) => {
      const uid = "tag-list-" + escapeHtml(tag);
      const list = document.getElementById(uid);
      const state = tradeListState.get(uid);
      if (!list || !state) return;
      list.classList.add("open");
      openTags.add(tag);
      const desired = shownObj[tag];
      if (desired && desired > state.shown) {
        const nextShown = Math.min(desired, state.rows.length);
        const newItemsHtml = state.rows.slice(state.shown, nextShown).map(tradeListItemHtml).join("");
        state.shown = nextShown;
        const moreLi = list.querySelector(".tag-trade-list-more");
        if (moreLi) {
          moreLi.insertAdjacentHTML("beforebegin", newItemsHtml);
          if (state.shown < state.rows.length) {
            const btn = moreLi.querySelector("[data-load-more]");
            if (btn) btn.textContent = `Load more (${state.rows.length - state.shown} left)`;
          } else {
            moreLi.remove();
          }
        }
      }
    });
  }

  function render(rows) {
    const tagged = rows.filter((r) => Array.isArray(r.lesson_tags) && r.lesson_tags.length);
    if (!tagged.length) {
      content.innerHTML = `<div class="empty-state">No tagged lessons yet — this needs trades published after the lesson-tagging update. Older trades won't show up here.</div>`;
      return;
    }

    const byTag = {};
    for (const r of rows) {
      for (const tag of r.lesson_tags || []) {
        byTag[tag] = byTag[tag] || [];
        byTag[tag].push(r);
      }
    }
    const entries = Object.entries(byTag).sort((a, b) => b[1].length - a[1].length);
    const maxCount = entries[0][1].length;

    content.innerHTML = `
      <div class="panel-box">
        <div class="panel-box-head"><span class="title">By frequency</span></div>
        ${entries.map(([tag, trades]) => {
          const uid = "tag-list-" + escapeHtml(tag);
          const tagColor = window.setupTagStyle(tag);
          return `
          <div class="bar-row cursor-pointer" data-tag-toggle="${escapeHtml(tag)}">
            <div class="bar-label">${window.setupTagDot(tag)}${escapeHtml(tag.replace(/_/g, " "))}</div>
            <div class="bar-track"><div class="bar-fill" style="width:${Math.round((trades.length / maxCount) * 100)}%; background:${tagColor.fg};"></div></div>
            <div class="bar-count">${trades.length}x</div>
          </div>
          ${tradeListHtml(trades, uid)}
        `;
        }).join("")}
      </div>
    `;

    content.querySelectorAll("[data-tag-toggle]").forEach((row) => {
      row.addEventListener("click", () => {
        const tag = row.getAttribute("data-tag-toggle");
        const list = document.getElementById("tag-list-" + tag);
        if (!list) return;
        const nowOpen = list.classList.toggle("open");
        if (nowOpen) openTags.add(tag); else openTags.delete(tag);
        syncUrlState();
      });
    });
    // Only the data-load-more half of window.bindTradeToggles applies
    // here -- this page's own expand/collapse toggle above uses
    // data-tag-toggle (keyed by tag name, not a uid) since which tags
    // are open needs to survive a reload the same way, just keyed
    // differently than edge-analysis.js/stats.html's uid-keyed rows.
    window.bindTradeToggles(content, syncUrlState);

    // Restored last, once the tag rows + their tradeListState entries
    // above all exist to restore into.
    restoreUrlState();
  }
})();
</script>
<script src="js/common.js"></script>
<script src="js/global-search.js"></script>
</body>
</html>
