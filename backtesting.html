          <label>Symbol</label>
          <input type="text" class="filter-input" id="bt-symbol" placeholder="e.g. AAPL">
        </div>
        <div class="filter-field">
          <label>Side</label>
          <select class="filter-input" id="bt-side">
            <option value="">All</option>
            <option value="long">Long</option>
            <option value="short">Short</option>
          </select>
        </div>
        <div class="filter-field">
          <label>From</label>
          <input type="date" class="filter-input" id="bt-from">
        </div>

          <label>To</label>
          <input type="date" class="filter-input" id="bt-to">
        </div>

      <div id="bt-results">
        <div class="loading-line">Loading trades…</div>
      </div>

      <div class="section-label">Equity curve (filtered)</div>
      <div id="bt-equity-chart" style="height:220px;"></div>

      <div class="section-label">Matching trades</div>
      <div id="bt-trade-list" class="checklist-box"></div>
    </div>

    <div class="footer">trade.log — backtests run against data/trades.json</div>
  </div>

<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<script>
(function () {
  "use strict";
  let allTrades = [];
  let chart = null, series = null;

  fetch("data/trades.json")
    .then((r) => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then((rows) => {
      allTrades = Array.isArray(rows) ? rows : [];
      populateSetupOptions(allTrades);
      runBacktest();
    })
    .catch((err) => {
      document.getElementById("bt-results").innerHTML =
        `<div class="empty-state">Couldn't load data/trades.json (${escapeHtml(String(err.message))}).</div>`;
    });

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  function populateSetupOptions(rows) {
    const setups = Array.from(new Set(rows.map((r) => r.setup_type).filter(Boolean))).sort();
    const sel = document.getElementById("bt-setup");
    for (const s of setups) {
      const opt = document.createElement("option");
      opt.value = s;
      opt.textContent = s;
      sel.appendChild(opt);
    }
  }

  function applyFilters(rows) {
    const setup = document.getElementById("bt-setup").value;
    const symbol = document.getElementById("bt-symbol").value.trim().toUpperCase();
    const side = document.getElementById("bt-side").value;
    const from = document.getElementById("bt-from").value;
    const to = document.getElementById("bt-to").value;

    return rows.filter((r) => {
      if (setup && r.setup_type !== setup) return false;
      if (symbol && (r.symbol || "").toUpperCase() !== symbol) return false;
      if (side && (r.side || "").toLowerCase() !== side) return false;
      if (from && r.trade_date < from) return false;
      if (to && r.trade_date > to) return false;
      return true;
    });
  }

  function runBacktest() {
    const filtered = applyFilters(allTrades).slice().sort((a, b) =>
      (a.trade_date + (a.entry_time || "")).localeCompare(b.trade_date + (b.entry_time || ""))
    );
    renderResults(filtered);
    renderEquity(filtered);
    renderTradeList(filtered);
  }

  function renderResults(rows) {
    const box = document.getElementById("bt-results");
    if (!rows.length) {
      box.innerHTML = `<div class="empty-state">No trades match these filters yet.</div>`;
      return;
    }
    const wins = rows.filter((r) => r.win);
    const losses = rows.filter((r) => !r.win);
    const pnl = (r) => (typeof r.pnl_after_comm === "number" ? r.pnl_after_comm : 0);
    const netPnl = rows.reduce((s, r) => s + pnl(r), 0);
    const grossWin = wins.reduce((s, r) => s + pnl(r), 0);
    const grossLoss = Math.abs(losses.reduce((s, r) => s + pnl(r), 0));
    const winRate = (wins.length / rows.length) * 100;
    const avgWin = wins.length ? grossWin / wins.length : 0;
    const avgLoss = losses.length ? grossLoss / losses.length : 0;
    const profitFactor = grossLoss > 0 ? grossWin / grossLoss : (grossWin > 0 ? Infinity : 0);
    const fmt = (n) => (n < 0 ? "-$" : "$") + Math.abs(n).toLocaleString(undefined, { maximumFractionDigits: 0 });

    box.innerHTML = `
      <div class="checklist-box">
        <label>${rows.length} matching trades · Win rate: <strong style="color:${winRate >= 50 ? "#2ecc71" : "#e74c3c"}">${winRate.toFixed(1)}%</strong></label>
        <label>Net P&amp;L: <strong style="color:${netPnl >= 0 ? "#2ecc71" : "#e74c3c"}">${fmt(netPnl)}</strong> · Profit factor: <strong>${profitFactor === Infinity ? "∞" : profitFactor.toFixed(2)}</strong></label>
        <label>Avg win: <strong style="color:#2ecc71">${fmt(avgWin)}</strong> · Avg loss: <strong style="color:#e74c3c">-${fmt(avgLoss)}</strong></label>
      </div>
    `;
  }

  function renderEquity(rows) {
    const el = document.getElementById("bt-equity-chart");
    el.innerHTML = "";
    if (!rows.length) return;
    chart = LightweightCharts.createChart(el, {
      width: el.clientWidth,
      height: 220,
      layout: { background: { color: "transparent" }, textColor: "#8b8fa3" },
      grid: { vertLines: { color: "#1b1e26" }, horzLines: { color: "#1b1e26" } },
      rightPriceScale: { borderColor: "#262a34" },
      timeScale: { borderColor: "#262a34" },
    });
    series = chart.addAreaSeries({
      lineColor: "#5b93f0", topColor: "rgba(91,147,240,0.28)", bottomColor: "rgba(91,147,240,0.02)", lineWidth: 2,
    });
    let running = 0;
    const byDate = new Map();
    for (const r of rows) {
      running += r.pnl_after_comm || 0;
      byDate.set(r.trade_date, running);
    }
    const data = Array.from(byDate.entries()).sort((a, b) => a[0].localeCompare(b[0])).map(([time, value]) => ({ time, value }));
    series.setData(data);
    chart.timeScale().fitContent();
    window.addEventListener("resize", () => chart.applyOptions({ width: el.clientWidth }));
  }

  function renderTradeList(rows) {
    const box = document.getElementById("bt-trade-list");
    if (!rows.length) {
      box.innerHTML = `<label>No matching trades.</label>`;
      return;
    }
    box.innerHTML = rows.slice(-25).reverse().map((r) => {
      const pnl = typeof r.pnl_after_comm === "number" ? r.pnl_after_comm : 0;
      const color = pnl >= 0 ? "#2ecc71" : "#e74c3c";
      return `<label><a href="trade.html?id=${encodeURIComponent(r.id)}">${escapeHtml(r.symbol || "?")} — ${escapeHtml(r.trade_date || "")}</a> <strong style="color:${color}">${pnl >= 0 ? "+" : "-"}$${Math.abs(pnl).toLocaleString(undefined, { maximumFractionDigits: 0 })}</strong></label>`;
    }).join("");
  }

  document.getElementById("bt-run").addEventListener("click", runBacktest);
})();
</script>
