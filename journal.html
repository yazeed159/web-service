  <div class="main">
    <header class="topbar">
      <div class="topbar-left">
        <h1 id="page-title">Journal</h1>
      </div>
      <div class="topbar-right">
        <button class="icon-btn" id="mobile-nav-btn" title="Menu" aria-label="Open menu">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
        </button>

    <div class="content">
      <div class="panel-head" style="display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap;">
        <div class="sub">All published trades. Click a row for the full breakdown.</div>
        <div style="display:flex; align-items:center; gap:8px;">
          <button class="btn-advanced" id="fill-float-btn">Fill missing floats</button>
          <button class="filter-btn hidden" id="fill-float-cancel-btn">Cancel</button>
          <span id="fill-float-status" class="sub" style="font-size:12.5px;"></span>
        </div>
      </div>

      <div id="fill-float-progress" class="panel-box" style="display:none; margin-bottom:16px;">
        <div class="panel-box-head"><span class="title">Fetching floats</span></div>
        <div class="progress-track"><div class="progress-fill" id="fill-float-fill" style="width:0%;"></div></div>
        <div id="fill-float-label">Starting…</div>
      </div>

      <button type="button" class="filters-toggle" id="filters-toggle" aria-expanded="false" aria-controls="journal-filters">
        <span>Filters</span><span class="filters-toggle-count" id="filters-toggle-count"></span><span class="filters-toggle-chev" aria-hidden="true">&#9662;</span>
      </button>
      <div class="date-chips" id="date-chips" role="group" aria-label="Quick date range">
        <button type="button" class="date-chip" data-range="today">Today</button>
        <button type="button" class="date-chip" data-range="yesterday">Yesterday</button>
        <button type="button" class="date-chip" data-range="week">This week</button>
        <button type="button" class="date-chip" data-range="month">This month</button>
      </div>
      <div class="filters" id="journal-filters">
        <input type="text" id="f-symbol" placeholder="Symbol…" aria-label="Symbol" style="width:110px;">
        <input type="date" id="f-from" title="From date" aria-label="From date">
        <input type="date" id="f-to" title="To date" aria-label="To date">
        <select id="f-setup"><option value="">All setups</option></select>
        <select id="f-result">
          <option value="">Win or loss</option>
          <option value="win">Wins only</option>
          <option value="loss">Losses only</option>
        </select>
        <select id="f-rvol" title="Relative volume on the trade day"><option value="">All rel. volume</option></select>
        <select id="f-avgvol" title="30-day average daily volume"><option value="">All avg. volume</option></select>
        <select id="f-float" title="Float (shares outstanding, approx.)"><option value="">All float</option></select>
        <select id="f-tag" title="Lesson tags you've logged on trades"><option value="">All tags</option></select>
        <select id="f-mysetup" title="Setup you labelled on the trade page"><option value="">My setup: any</option></select>
        <select id="f-mymistake" title="Mistake you tagged on the trade page"><option value="">My mistake: any</option></select>
        <select id="f-myrules" title="Whether you marked the trade as following your rules"><option value="">Rules: any</option><option value="yes">Followed rules</option><option value="no">Broke rules</option><option value="unset">Not answered</option></select>
        <select id="f-grade" title="Self-graded execution quality — separate from win/loss">
          <option value="">All grades</option>
          <option value="5">★★★★★ only</option>
          <option value="4">★★★★+ &amp; up</option>
          <option value="3">★★★+ &amp; up</option>
          <option value="2">★★+ &amp; up</option>
          <option value="1">★+ &amp; up</option>
          <option value="none">Ungraded</option>

        <label title="Filter by entry time of day">

        <label><input type="checkbox" id="f-flagged"> Has better entry/exit flagged</label>

      <div class="filter-presets" id="filter-presets"></div>

      <div id="journal-content">
        <div class="loading-line skel-cards" role="status" aria-busy="true" aria-label="Loading"><div class="skel-card"><div class="skel skel-avatar"></div><div class="skel-rowbody"><div class="skel skel-line w40"></div><div class="skel skel-line w60"></div></div><div class="skel skel-pnl"></div></div><div class="skel-card"><div class="skel skel-avatar"></div><div class="skel-rowbody"><div class="skel skel-line w40"></div><div class="skel skel-line w60"></div></div><div class="skel skel-pnl"></div></div><div class="skel-card"><div class="skel skel-avatar"></div><div class="skel-rowbody"><div class="skel skel-line w40"></div><div class="skel skel-line w60"></div></div><div class="skel skel-pnl"></div></div><div class="skel-card"><div class="skel skel-avatar"></div><div class="skel-rowbody"><div class="skel skel-line w40"></div><div class="skel skel-line w60"></div></div><div class="skel skel-pnl"></div></div><div class="skel-card"><div class="skel skel-avatar"></div><div class="skel-rowbody"><div class="skel skel-line w40"></div><div class="skel skel-line w60"></div></div><div class="skel skel-pnl"></div></div></div>

<script src="js/auth.js"></script>
<script src="js/accounts.js"></script>

<script src="js/trade-notes.js"></script>
<script src="js/share-export.js"></script>
<script src="js/ui-modal.js"></script>
<script>
(function () {
  "use strict";
  const content = document.getElementById("journal-content");
  // Back from a trade: restore scroll offset too (js/mobile-extras.js). Taken now,
  // before the SPA router's scroll-to-top; finished after the first table draw.
  const smSnap = window.ScrollMemory ? window.ScrollMemory.begin("journal") : null;
  // The Journal view you last had open this session (filters / sort / how far down
  // you'd loaded), read now because the first draw overwrites it. Used for the
  // "Resume your last view" chip when you reach a bare Journal from the tab bar.
  let lastView = null;
  try {
    const u = sessionStorage.getItem("tl:journal:url"), at = Number(sessionStorage.getItem("tl:journal:url-at")) || 0;
    if (u && u.indexOf("?") !== -1 && Date.now() - at < 6 * 3600 * 1000) lastView = u;
  } catch (e) { /* ignore */ }
  let allRows = [];
  let sortKey = "trade_date";
  let sortDir = "desc"; // desc = newest first
  // Restored from the URL once on boot (see NavState in nav.js) if the
  // person is coming back here via Back rather than landing fresh; how
  // many rows were scrolled into via "Load more" before they clicked
  // into a trade. Consumed once by the first renderTable() call below.
  let bootShown = null;

  // Row multi-select (checkbox column) -- a plain in-memory Set of trade
  // ids, not persisted across page loads. Survives filter/sort/re-render
  // since it's keyed by id rather than row position.
  let selectedIds = new Set();
  // The last rows renderTable() sorted, so a selection/column change can
  // redraw the table without re-filtering allRows from scratch.
  let lastSortedRows = [];

  const els = {
    symbol: document.getElementById("f-symbol"),
    from: document.getElementById("f-from"),
    to: document.getElementById("f-to"),
    setup: document.getElementById("f-setup"),
    result: document.getElementById("f-result"),
    rvol: document.getElementById("f-rvol"),
    avgvol: document.getElementById("f-avgvol"),
    float: document.getElementById("f-float"),
    tag: document.getElementById("f-tag"),
    mySetup: document.getElementById("f-mysetup"),
    myMistake: document.getElementById("f-mymistake"),
    myRules: document.getElementById("f-myrules"),
    grade: document.getElementById("f-grade"),
    flagged: document.getElementById("f-flagged"),
    timeFrom: document.getElementById("f-time-from"),
    timeTo: document.getElementById("f-time-to"),
  };
  Object.values(els).forEach((el) => el.addEventListener("input", applyFilters));

  // ------------------------------------------------------------------
  // Column layout -- order + width -- and saved filter presets.
  // Persisted the same way as trade-notes.js/grade.js: instant to
  // localStorage, mirrored to the signed-in user's Supabase user_kv row
  // via window.KV (private per user, RLS-scoped), so both follow the
  // trader across devices instead of resetting on a new browser -- same
  // idea as the sidebar's collapsed/expanded state, just synced further.
  // ------------------------------------------------------------------
  const COLS_KEY = "trade.log:journal_columns";
  const PRESETS_KEY = "trade.log:journal_presets";

  function readLocal(key, fallback) {
    try { const raw = localStorage.getItem(key); return raw !== null ? JSON.parse(raw) : fallback; } catch (e) { return fallback; }
  }
  function writeLocal(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) { /* ignore */ } }

  // Tags cell -- the auto-computed lesson_tags pills, plus the trader's
  // own mistake tags from trade-notes.js (writable, unlike lesson_tags),
  // plus a small pencil affordance that opens the inline quick-edit.
  function tagsCellHtml(r) {
    const lessonTags = (r.lesson_tags || []).filter(Boolean);
    const je = window.TradeNotes ? window.TradeNotes.get(r.id) : null;
    const userTags = (je && je.mistakes) || [];
    const pills = lessonTags.map((t) => `<span class="pill tagpill" style="${window.setupTagStyleAttr(t)}">${escapeHtml(t.replace(/_/g, " "))}</span>`)
      .concat(userTags.map((t) => `<span class="pill tagpill user-tag" title="Your tag">${escapeHtml(t)}</span>`))
      .join(" ");
    return `<span class="tags-cell">
        <span class="tags-cell-pills">${pills || `<span class="dim">—</span>`}</span>
        <button type="button" class="tags-edit-btn" data-quick-edit="${escapeHtml(r.id)}" title="Quick edit tags &amp; note">&#9998;</button>
      </span>`;
  }

  const ALL_COLUMNS = [
    { id: "trade_date", label: "Date", sortable: true, width: 100, csv: (r) => r.trade_date, render: (r) => escapeHtml(r.trade_date) },
    { id: "symbol", label: "Symbol", sortable: true, width: 90, csv: (r) => r.symbol, render: (r) => escapeHtml(r.symbol) },
    { id: "setup_type", label: "Setup", sortable: true, width: 130, csv: (r) => r.setup_type || "", render: (r) => `${r.setup_type ? window.setupTagDot(r.setup_type) : ""}${escapeHtml((r.setup_type || "—").replace(/_/g, " "))}` },
    { id: "entry_price", label: "Entry", sortable: true, width: 80, csv: (r) => Number(r.entry_price).toFixed(2), render: (r) => `$${Number(r.entry_price).toFixed(2)}` },
    { id: "exit_price", label: "Exit", sortable: true, width: 80, csv: (r) => Number(r.exit_price).toFixed(2), render: (r) => `$${Number(r.exit_price).toFixed(2)}${r.fill_count > 1 ? `<span class="pill" title="Averaged across ${r.fill_count} fills -- open the trade for the breakdown" style="margin-left:5px; padding:1px 5px; font-size:10px; opacity:.75;">×${r.fill_count}</span>` : ""}` },
    { id: "pnl_after_comm", label: "Net P&L", sortable: true, width: 100, csv: (r) => (r.pnl_after_comm || 0).toFixed(2), render: (r) => `<span class="${r.pnl_after_comm >= 0 ? "up" : "down"}">${fmtMoney(r.pnl_after_comm)}</span>` },
    { id: "win", label: "Result", sortable: true, width: 80, csv: (r) => (r.win ? "WIN" : "LOSS"), render: (r) => `<span class="pill ${r.win ? "win" : "loss"}">${r.win ? "WIN" : "LOSS"}</span>` },
    { id: "grade", label: "Grade", sortable: true, width: 100, csv: (r) => (window.TradeGrade ? (window.TradeGrade.get(r) || "") : ""), render: (r) => (window.TradeGrade ? window.TradeGrade.starsHtml(window.TradeGrade.get(r), { size: 12 }) : "—") },
    { id: "tags", label: "Tags", sortable: false, width: 240,
      csv: (r) => { const je = window.TradeNotes ? window.TradeNotes.get(r.id) : null; return (r.lesson_tags || []).concat((je && je.mistakes) || []).join("; "); },
      render: tagsCellHtml },
  ];
  // Journal fields for the CSV export only (kept out of ALL_COLUMNS so the table
  // and its column picker are unchanged). Text fields are prefixed with an
  // apostrophe when they start with = + - @ so Excel never runs them as formulas.
  const csvSafe = (v) => { const t = String(v == null ? "" : v); return /^[=+\-@\t\r]/.test(t) ? "'" + t : t; };
  const jEntry = (r) => (window.TradeNotes ? window.TradeNotes.get(r.id) : null) || null;
  const jMetrics = (r) => (window.TradeNotes ? window.TradeNotes.metrics(r, jEntry(r)) : {});
  const JOURNAL_EXPORT_COLUMNS = [
    { id: "j_plan_stop", label: "Planned stop", csv: (r) => { const e = jEntry(r); return e ? (e.plan_stop != null ? e.plan_stop : (e.no_stop ? "none" : "")) : ""; } },
    { id: "j_plan_target", label: "Planned target", csv: (r) => { const e = jEntry(r); return e ? (e.plan_target != null ? e.plan_target : (e.no_target ? "none" : "")) : ""; } },
    { id: "j_planned_rr", label: "Planned R:R", csv: (r) => { const m = jMetrics(r); return m.planned_rr != null ? m.planned_rr.toFixed(2) : ""; } },
    { id: "j_r_multiple", label: "Realised R", csv: (r) => { const m = jMetrics(r); return m.r_multiple != null ? m.r_multiple.toFixed(2) : ""; } },
    { id: "j_setup", label: "My setup tag", csv: (r) => { const e = jEntry(r); return csvSafe(e ? e.setup : ""); } },
    { id: "j_mistakes", label: "My mistakes", csv: (r) => { const e = jEntry(r); return csvSafe(e && e.mistakes ? e.mistakes.join("; ") : ""); } },
    { id: "j_followed_rules", label: "Followed my rules", csv: (r) => { const e = jEntry(r); return e && e.followed_rules === true ? "Yes" : e && e.followed_rules === false ? "No" : ""; } },
    { id: "j_notes", label: "My notes", csv: (r) => { const e = jEntry(r); return csvSafe(e ? e.notes : ""); } },
  ];
  const EXPORT_COLUMNS = ALL_COLUMNS.concat(JOURNAL_EXPORT_COLUMNS);
  const DEFAULT_ORDER = ALL_COLUMNS.map((c) => c.id);
  let colOrder = DEFAULT_ORDER.slice();
  let colWidths = {};
  ALL_COLUMNS.forEach((c) => { colWidths[c.id] = c.width; });
  function colDefsByOrder() { return colOrder.map((id) => ALL_COLUMNS.find((c) => c.id === id)).filter(Boolean); }

  function applyColumnPrefs(prefs) {
    if (!prefs) return;
    if (Array.isArray(prefs.order) && prefs.order.length) {
      const valid = prefs.order.filter((id) => DEFAULT_ORDER.includes(id));
      const missing = DEFAULT_ORDER.filter((id) => !valid.includes(id));
      colOrder = valid.concat(missing);
    }
    if (prefs.widths) {
      Object.keys(prefs.widths).forEach((id) => {
        const w = prefs.widths[id];
        if (colWidths[id] != null && typeof w === "number" && w >= 40) colWidths[id] = w;
      });
    }
  }
  function saveColumnPrefs() {
    const prefs = { order: colOrder, widths: colWidths };
    writeLocal(COLS_KEY, prefs);
    if (window.KV) window.KV.set(COLS_KEY, prefs);
  }
  applyColumnPrefs(readLocal(COLS_KEY, null));
  if (window.KV) window.KV.sync(COLS_KEY, (remote) => { applyColumnPrefs(remote); if (lastSortedRows.length) redrawTable(); });

  // ---- Saved filter presets ("This month, losers only" chips) ---------
  let presets = readLocal(PRESETS_KEY, []);
  if (window.KV) window.KV.sync(PRESETS_KEY, (remote) => { presets = Array.isArray(remote) ? remote : presets; renderPresetChips(); });

  function currentFilterState() {
    return {
      symbol: els.symbol.value.trim(), from: els.from.value, to: els.to.value,
      setup: els.setup.value, result: els.result.value, rvol: els.rvol.value,
      avgvol: els.avgvol.value, float: els.float.value, tag: els.tag.value,
      mySetup: els.mySetup.value, myMistake: els.myMistake.value, myRules: els.myRules.value,
      grade: els.grade.value, flagged: els.flagged.checked,
      timeFrom: els.timeFrom.value, timeTo: els.timeTo.value,
      sortKey, sortDir,
    };
  }
  function applyFilterState(state) {
    if (!state) return;
    els.symbol.value = state.symbol || ""; els.from.value = state.from || ""; els.to.value = state.to || "";
    if (state.setup) els.setup.value = state.setup;
    els.result.value = state.result || "";
    if (state.rvol) els.rvol.value = state.rvol;
    if (state.avgvol) els.avgvol.value = state.avgvol;
    if (state.float) els.float.value = state.float;
    if (state.tag) els.tag.value = state.tag;
    if (state.mySetup) els.mySetup.value = state.mySetup;
    if (state.myMistake) els.myMistake.value = state.myMistake;
    els.myRules.value = state.myRules || "";
    els.grade.value = state.grade || "";
    els.flagged.checked = !!state.flagged;
    els.timeFrom.value = state.timeFrom || ""; els.timeTo.value = state.timeTo || "";
    sortKey = state.sortKey || "trade_date"; sortDir = state.sortDir || "desc";
    applyFilters();
  }
  function savePresets() {
    writeLocal(PRESETS_KEY, presets);
    if (window.KV) window.KV.set(PRESETS_KEY, presets);
  }
  function renderPresetChips() {
    const wrap = document.getElementById("filter-presets");
    if (!wrap) return;
    wrap.innerHTML = presets.map((p, i) => `
        <span class="preset-chip" data-preset-idx="${i}">
          <span class="preset-chip-label">${escapeHtml(p.name)}</span>
          <button type="button" class="preset-chip-x" data-preset-del="${i}" title="Delete preset" aria-label="Delete preset">&times;</button>
        </span>`).join("") +
      `<button type="button" class="filter-btn preset-save-btn" id="preset-save-btn" style="padding:5px 10px; font-size:12px;">+ Save current filters</button>`;
    wrap.querySelectorAll("[data-preset-idx]").forEach((chip) => {
      chip.addEventListener("click", (e) => {
        if (e.target.closest("[data-preset-del]")) return;
        applyFilterState(presets[Number(chip.getAttribute("data-preset-idx"))].state);
      });
    });
    wrap.querySelectorAll("[data-preset-del]").forEach((btn) => {
      btn.addEventListener("click", async (e) => {
        e.stopPropagation();
        const idx = Number(btn.getAttribute("data-preset-del"));
        const ok = window.UIModal ? await UIModal.confirm(`Delete the preset "${presets[idx].name}"?`, { tone: "danger", confirmLabel: "Delete" }) : confirm("Delete this preset?");
        if (!ok) return;
        presets.splice(idx, 1);
        savePresets();
        renderPresetChips();
      });
    });
    const saveBtn = document.getElementById("preset-save-btn");
    if (saveBtn) {
      saveBtn.addEventListener("click", async () => {
        const name = window.UIModal
          ? await UIModal.prompt("Name this preset:", "", { title: "Save filter preset", confirmLabel: "Save" })
          : prompt("Name this preset:", "");
        if (!name || !name.trim()) return;
        presets.push({ name: name.trim(), state: currentFilterState() });
        savePresets();
        renderPresetChips();
      });
    }
  }
  renderPresetChips();

  // "Fill missing floats" -- bulk on-demand float lookup for every trade
  // that doesn't have one yet (float_tag null or "float_unknown"), so
  // trades imported before /fetch-float existed (or imported in bulk via
  // import-trades.html/import-legacy.html) don't have to be opened one
  // at a time just to click "Get float" on trade.html. Same
  // start -> poll -> cancel job shape as the Backtester tab
  // (chart_service.py's /backtest/start & friends) -- see
  // /fetch-float/bulk/start there. Each symbol's lookup is written
  // straight onto every one of its trades via the same save_float_to_trade
  // path the single-trade /fetch-float route uses, so re-opening any of
  // them afterward already shows the float with no extra click.
  const floatBtn = document.getElementById("fill-float-btn");
  const floatCancelBtn = document.getElementById("fill-float-cancel-btn");
  const floatStatus = document.getElementById("fill-float-status");
  const floatProgress = document.getElementById("fill-float-progress");
  const floatFill = document.getElementById("fill-float-fill");
  const floatLabel = document.getElementById("fill-float-label");
  let floatJobId = null;
  let floatPollTimer = null;

  function chartApi() { return (window.CHART_SERVICE_URL || "").replace(/\/+$/, ""); }
  // Same pattern as backtester.js's authedHeaders()/trade.js's authedPost --
  // attaches the logged-in person's Supabase access token so chart_service.py
  // can scope the job to them. window.AUTH_READY (auth.js) resolves once
  // per page load and is safe to .then() repeatedly.
  function authedHeadersJ(extra) {
    return window.AUTH_READY.then((session) => {
      if (!session) throw new Error("Please log in first.");
      return Object.assign(
        { "Content-Type": "application/json", "ngrok-skip-browser-warning": "true" },
        extra || {},
        { "Authorization": "Bearer " + session.access_token }
      );
    });
  }

  function floatBtnIdle() {
    floatBtn.disabled = false;
    floatBtn.textContent = "Fill missing floats";
    floatCancelBtn.classList.remove("hidden"); floatCancelBtn.style.display = "none";
  }

  if (floatBtn) {
    floatBtn.addEventListener("click", () => {
      if (!chartApi()) { floatStatus.textContent = "CHART_SERVICE_URL isn't set in config.js."; return; }
      floatBtn.disabled = true;
      floatBtn.textContent = "Starting…";
      floatStatus.textContent = "";
      authedHeadersJ()
        .then((headers) => fetch(`${chartApi()}/fetch-float/bulk/start`, { method: "POST", headers }))
        .then((r) => r.json().then((j) => { if (!r.ok) throw new Error(j.error || ("HTTP " + r.status)); return j; }))
        .then((j) => {
          if (!j.total_symbols) {
            floatBtnIdle();
            floatStatus.textContent = "Every trade already has a float on file.";
            return;
          }
          floatJobId = j.job_id;
          floatBtn.textContent = "Running…";
          floatCancelBtn.classList.remove("hidden"); floatCancelBtn.style.display = "";
          floatCancelBtn.disabled = false;
          floatCancelBtn.textContent = "Cancel";
          floatProgress.style.display = "";
          floatFill.style.width = "0%";
          floatLabel.textContent = `0 / ${j.total_symbols} symbols`;
          pollFloatJob(j.job_id);
        })
        .catch((err) => {
          floatBtnIdle();
          floatStatus.textContent = "Couldn't start: " + err.message;
        });
    });
  }

  if (floatCancelBtn) {
    floatCancelBtn.addEventListener("click", () => {
      if (!floatJobId) return;
      floatCancelBtn.disabled = true;
      floatCancelBtn.textContent = "Cancelling…";
      authedHeadersJ()
        .then((headers) => fetch(`${chartApi()}/fetch-float/bulk/cancel/${floatJobId}`, { method: "POST", headers }))
        .catch(() => { /* status poll surfaces any real problem */ });
    });
  }

  function pollFloatJob(jobId) {
    clearTimeout(floatPollTimer);
    const tick = () => {
      authedHeadersJ()
        .then((headers) => fetch(`${chartApi()}/fetch-float/bulk/status/${jobId}`, { headers }))
        .then((r) => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
        .then((job) => {
          const total = job.total_symbols || 0;
          const done = job.current_index || 0;
          if (total) floatFill.style.width = Math.round((done / total) * 100) + "%";
          floatLabel.textContent = `${done} / ${total} symbols` +
            (job.current_symbol && job.status === "running" ? ` — ${job.current_symbol}` : "");

          if (job.status === "running") {
            floatPollTimer = setTimeout(tick, 1000);
            return;
          }
          floatProgress.style.display = "none";
          floatBtnIdle();
          floatJobId = null;
          if (job.status === "cancelled") {
            floatStatus.textContent = `Cancelled — updated ${job.trades_updated || 0} trade(s) before stopping.`;
          } else if (job.status === "error") {
            floatStatus.textContent = "Failed: " + (job.error || "unknown error");
          } else {
            const errCount = (job.errors || []).length;
            floatStatus.textContent = `Done — updated ${job.trades_updated || 0} trade(s) across ${total} symbol(s)` +
              (errCount ? `, ${errCount} symbol(s) failed` : "") + ".";
          }
          // Re-pull from Supabase (rather than patching allRows by hand)
          // so the table reflects exactly what a fresh page load would
          // show, then just re-render with the filters already in place.
          window.swrFetch("trades", window.fetchTradesIndex).then((rows) => {
            allRows = Array.isArray(rows) ? rows : allRows;
            applyFilters();
          }).catch(() => { /* table just keeps showing pre-update data */ });
        })
        .catch((err) => {
          floatProgress.style.display = "none";
          floatBtnIdle();
          floatJobId = null;
          floatStatus.textContent = "Lost track of the job: " + err.message;
        });
    };
    tick();
  }

  // Human-readable labels for the volume/rvol/float tags chart_service.py
  // buckets trades into (see classify_avg_volume / classify_relative_volume
  // / classify_float there) -- falls back to a de-slugged version of the
  // raw tag for anything not in this map, so a new bucket added later still
  // shows up instead of being silently hidden.
  const TAG_LABELS = {
    avgvol_under_500k: "Avg vol < 500K", avgvol_500k_1m: "Avg vol 500K–1M",
    avgvol_1m_5m: "Avg vol 1M–5M", avgvol_5m_20m: "Avg vol 5M–20M", avgvol_20m_plus: "Avg vol 20M+",
    avgvol_unknown: "Avg vol unknown",
    rvol_under_1x: "RVol < 1x", rvol_1x_2x: "RVol 1x–2x", rvol_2x_5x: "RVol 2x–5x",
    rvol_5x_10x: "RVol 5x–10x", rvol_10x_plus: "RVol 10x+", rvol_unknown: "RVol unknown",
    float_micro_under_10m: "Float < 10M", float_low_10m_20m: "Float 10M–20M",
    float_mid_20m_50m: "Float 20M–50M", float_large_50m_200m: "Float 50M–200M",
    float_mega_200m_plus: "Float 200M+", float_unknown: "Float unknown",
  };
  function tagLabel(tag) {
    return TAG_LABELS[tag] || String(tag).replace(/_/g, " ");
  }

  // Paints from the on-device snapshot first (instant), then swaps in the fresh
  // Supabase rows. boot() runs once per source, so everything in it has to be safe
  // to run twice: the dropdowns are rebuilt (keeping the current selection) and
  // the URL-state restore only happens on the very first pass.
  let booted = false;
  function boot(rows) {
      allRows = Array.isArray(rows) ? rows : [];
      const prevSel = booted ? {
        setup: els.setup.value, avgvol: els.avgvol.value, rvol: els.rvol.value, float: els.float.value, tag: els.tag.value,
      } : null;
      [els.setup, els.avgvol, els.rvol, els.float, els.tag].forEach((sel) => { while (sel.options.length > 1) sel.remove(1); });
      const setups = Array.from(new Set(allRows.map((r) => r.setup_type).filter(Boolean))).sort();
      for (const s of setups) {
        const opt = document.createElement("option");
        opt.value = s;
        opt.textContent = s.replace(/_/g, " ");
        els.setup.appendChild(opt);
      }
      // Same pattern as the setup filter above, one per volume/rvol/float
      // field, skipping the "unknown" bucket in the dropdown (nothing to
      // usefully filter by) but still showing it as a pill in the table.
      const tagFilterFields = [["avg_volume_tag", els.avgvol], ["rvol_tag", els.rvol], ["float_tag", els.float]];
      for (const [field, select] of tagFilterFields) {
        const tags = Array.from(new Set(allRows.map((r) => r[field]).filter((t) => t && !t.endsWith("_unknown")))).sort();
        for (const t of tags) {
          const opt = document.createElement("option");
          opt.value = t;
          opt.textContent = tagLabel(t);
          select.appendChild(opt);
        }
      }
      // Lesson tags -- the trader's own review tags (see lesson_tags on
      // each row), same field stats.html/patterns.html/playbooks.html
      // build their tag breakdowns from. Populates the Tags filter and
      // is what the table's Tags column actually renders below.
      const lessonTagSet = new Set();
      allRows.forEach((r) => (r.lesson_tags || []).forEach((t) => t && lessonTagSet.add(t)));
      Array.from(lessonTagSet).sort().forEach((t) => {
        const opt = document.createElement("option");
        opt.value = t;
        opt.textContent = t.replace(/_/g, " ");
        els.tag.appendChild(opt);
      });
      if (!booted) {
        // Restore filters/sort/scroll-depth from the URL -- either a deep
        // link from stats.html's setup breakdown (or Rewind's own
        // "setups to review" list), which only ever set `setup`, or this
        // page's own state mirrored back into the URL by syncUrlState()
        // below so that hitting Back from trade.html lands you right
        // back where you were instead of resetting to a blank table.
        const setupParam = NavState.get("setup");
        if (setupParam && setups.includes(setupParam)) els.setup.value = setupParam;
        const rvolParam = NavState.get("rvol");
        if (rvolParam && Array.from(els.rvol.options).some((o) => o.value === rvolParam)) els.rvol.value = rvolParam;
        const avgvolParam = NavState.get("avgvol");
        if (avgvolParam && Array.from(els.avgvol.options).some((o) => o.value === avgvolParam)) els.avgvol.value = avgvolParam;
        const floatParam = NavState.get("float");
        if (floatParam && Array.from(els.float.options).some((o) => o.value === floatParam)) els.float.value = floatParam;
        const tagParam = NavState.get("tag");
        if (tagParam && Array.from(els.tag.options).some((o) => o.value === tagParam)) els.tag.value = tagParam;

        const symbolParam = NavState.get("symbol");
        if (symbolParam) els.symbol.value = symbolParam;
        const fromParam = NavState.get("from");
        if (fromParam) els.from.value = fromParam;
        const toParam = NavState.get("to");
        if (toParam) els.to.value = toParam;
        const resultParam = NavState.get("result");
        if (resultParam) els.result.value = resultParam;
        const gradeParam = NavState.get("grade");
        if (gradeParam) els.grade.value = gradeParam;
        if (NavState.get("flagged") === "1") els.flagged.checked = true;
        const tFromParam = NavState.get("tfrom");
        if (tFromParam) els.timeFrom.value = tFromParam;
        const tToParam = NavState.get("tto");
        if (tToParam) els.timeTo.value = tToParam;

        sortKey = NavState.get("sort", sortKey);
        sortDir = NavState.get("dir", sortDir);
        const nParam = parseInt(NavState.get("n"), 10);
        if (Number.isInteger(nParam) && nParam > TABLE_PAGE_SIZE) bootShown = nParam;

      } else {
        // Refresh pass: keep whatever the user has selected, and keep how far down they loaded.
        const pairs = [[els.setup, prevSel.setup], [els.avgvol, prevSel.avgvol], [els.rvol, prevSel.rvol], [els.float, prevSel.float], [els.tag, prevSel.tag]];
        pairs.forEach(([sel, v]) => { if (v && Array.from(sel.options).some((o) => o.value === v)) sel.value = v; });
        bootShown = tableShown || null;
      }
      booted = true;

      applyFilters();
  }
  window.swrFetch("trades", window.fetchTradesIndex, boot)
    .then(boot)
    .catch((err) => {
      if (booted) return; // snapshot is already on screen; keep it
      content.innerHTML = `<div class="empty-state">Couldn't load your trades (${escapeHtml(String(err.message))}).</div>`;
    });

  // escapeHtml() now in utils.js (loads first on every page).
  // fmtMoney() now in utils.js (loads first on every page).

  // Fill the "my setup"/"my mistake" dropdowns from the tags actually used
  // in the journal entries (trade-notes.js), keeping any current selection.
  function populateJournalFilters() {
    if (!window.TradeNotes) return;
    const entries = Object.values(window.TradeNotes.all());
    const setups = new Set(), mistakes = new Set();
    entries.forEach((e) => { if (e.setup) setups.add(e.setup); (e.mistakes || []).forEach((m) => mistakes.add(m)); });
    const fill = (sel, values, anyLabel) => {
      const cur = sel.value;
      sel.innerHTML = `<option value="">${anyLabel}</option>` + Array.from(values).sort().map((v) => `<option value="${escapeHtml(v)}">${escapeHtml(v)}</option>`).join("");
      if (cur && values.has(cur)) sel.value = cur;
    };
    fill(els.mySetup, setups, "My setup: any");
    fill(els.myMistake, mistakes, "My mistake: any");
  }
  populateJournalFilters();
  if (window.KV) window.KV.ready.then(() => { populateJournalFilters(); });

  // Quick date chips: Today / Yesterday / This week (Mon-today) / This month.
  // They just fill the From/To inputs and fire the normal "input" path, so
  // URL sync, the filter-count badge and presets all keep working. Tapping
  // the active chip again clears the range.
  const dateChipBox = document.getElementById("date-chips");
  function isoLocal(d) {
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }
  function chipRange(kind) {
    const t = new Date(); t.setHours(12, 0, 0, 0);
    if (kind === "today") return [isoLocal(t), isoLocal(t)];
    if (kind === "yesterday") { const y = new Date(t); y.setDate(y.getDate() - 1); return [isoLocal(y), isoLocal(y)]; }
    if (kind === "week") { const m = new Date(t); m.setDate(m.getDate() - ((m.getDay() + 6) % 7)); return [isoLocal(m), isoLocal(t)]; }
    if (kind === "month") { const f = new Date(t.getFullYear(), t.getMonth(), 1, 12); return [isoLocal(f), isoLocal(t)]; }
    return ["", ""];
  }
  function refreshDateChips() {
    if (!dateChipBox) return;
    dateChipBox.querySelectorAll(".date-chip").forEach((b) => {
      const [f, t] = chipRange(b.dataset.range);
      const on = els.from.value === f && els.to.value === t;
      b.classList.toggle("active", on);
      b.setAttribute("aria-pressed", on ? "true" : "false");
    });
  }
  if (dateChipBox) dateChipBox.addEventListener("click", (e) => {
    const b = e.target.closest(".date-chip");
    if (!b) return;
    const [f, t] = b.classList.contains("active") ? ["", ""] : chipRange(b.dataset.range);
    els.from.value = f; els.to.value = t;
    els.from.dispatchEvent(new Event("input", { bubbles: true }));
  });

  function applyFilters() {
    refreshDateChips();
    const symbol = els.symbol.value.trim().toUpperCase();
    const from = els.from.value;
    const to = els.to.value;
    const setup = els.setup.value;
    const result = els.result.value;
    const rvol = els.rvol.value;
    const avgvol = els.avgvol.value;
    const floatTag = els.float.value;
    const tag = els.tag.value;
    const gradeFilter = els.grade.value;
    const mySetup = els.mySetup.value;
    const myMistake = els.myMistake.value;
    const myRules = els.myRules.value;
    const flaggedOnly = els.flagged.checked;
    const timeFrom = els.timeFrom.value; // "HH:MM" or ""
    const timeTo = els.timeTo.value;

    const filtered = allRows.filter((r) => {
      if (symbol && !String(r.symbol || "").toUpperCase().includes(symbol)) return false;
      if (from && r.trade_date < from) return false;
      if (to && r.trade_date > to) return false;
      if (setup && r.setup_type !== setup) return false;
      if (result === "win" && !r.win) return false;
      if (result === "loss" && r.win) return false;
      if (rvol && r.rvol_tag !== rvol) return false;
      if (avgvol && r.avg_volume_tag !== avgvol) return false;
      if (floatTag && r.float_tag !== floatTag) return false;
      if (tag && !(r.lesson_tags || []).includes(tag)) return false;
      if (gradeFilter) {
        const g = window.TradeGrade ? window.TradeGrade.get(r) : null;
        if (gradeFilter === "none") { if (g) return false; }
        else if (!g || g < Number(gradeFilter)) return false;
      }
      if (flaggedOnly && !(r.better_entry_price || r.better_exit_price)) return false;
      if (mySetup || myMistake || myRules) {
        const je = window.TradeNotes ? window.TradeNotes.get(r.id) : null;
        if (mySetup && (!je || je.setup !== mySetup)) return false;
        if (myMistake && (!je || !(je.mistakes || []).includes(myMistake))) return false;
        if (myRules === "yes" && !(je && je.followed_rules === true)) return false;
        if (myRules === "no" && !(je && je.followed_rules === false)) return false;
        if (myRules === "unset" && je && je.followed_rules !== null && je.followed_rules !== undefined) return false;
      }
      // entry_time is "HH:MM:SS"; time inputs give "HH:MM" -- string
      // comparison on the HH:MM prefix is enough for a same-day range.
      const entryHM = String(r.entry_time || "").slice(0, 5);
      if (timeFrom && entryHM < timeFrom) return false;
      if (timeTo && entryHM > timeTo) return false;
      return true;
    });
    renderTable(filtered);
  }

  // Rendered TABLE_PAGE_SIZE rows at a time with a "Load more" button
  // rather than dumping the entire (possibly thousands-long) filtered
  // trade list into the DOM at once. Resets to the first page whenever
  // the filters or sort change (i.e. every fresh renderTable call);
  // "Load more" just grows the visible slice without re-rendering the
  // rows already on screen.
  const TABLE_PAGE_SIZE = 50;
  let tableRows = [];
  let tableShown = 0;

  // Mirrors the current filters/sort/scroll-depth into the URL (see
  // NavState in nav.js) so Back from trade.html restores this exact
  // view instead of resetting to a blank/default table. Called every
  // time renderTable() runs (filters, sort) and every time "Load more"
  // grows the visible page (see its click handler below).
  function syncUrlState() {
    NavState.set({
      symbol: els.symbol.value.trim() || null,
      from: els.from.value || null,
      to: els.to.value || null,
      setup: els.setup.value || null,
      result: els.result.value || null,
      rvol: els.rvol.value || null,
      avgvol: els.avgvol.value || null,
      float: els.float.value || null,
      tag: els.tag.value || null,
      grade: els.grade.value || null,
      flagged: els.flagged.checked ? "1" : null,
      tfrom: els.timeFrom.value || null,
      tto: els.timeTo.value || null,
      sort: sortKey !== "trade_date" ? sortKey : null,
      dir: sortDir !== "desc" ? sortDir : null,
      n: tableShown > TABLE_PAGE_SIZE ? tableShown : null,
    });
    // trade.html's "All trades" link returns to this exact view (see mobile-extras.js).
    try {
      sessionStorage.setItem("tl:journal:url", "journal.html" + location.search);
      sessionStorage.setItem("tl:journal:url-at", String(Date.now()));
    } catch (e) { /* ignore */ }
  }

  function renderTable(rows) {
    if (!rows.length) {
      content.innerHTML = allRows.length
        ? window.emptyStateHtml({
            icon: "journal",
            title: "No trades match",
            message: "Nothing fits the filters you've set. Loosen them to see your trades again.",
            actionId: "empty-clear-filters", actionLabel: "Clear filters",
          })
        : window.emptyStateHtml({
            icon: "journal",
            title: "No trades yet",
            message: "Import a broker CSV, or wait for your next daily sync — your trades land here, sortable, filterable and ready to review.",
            actionHref: "import-trades.html", actionLabel: "Import trades",
          });
      tableRows = []; lastSortedRows = [];
      return;
    }
    const sorted = rows.slice().sort((a, b) => {
      let av = a[sortKey], bv = b[sortKey];
      if (sortKey === "trade_date") { av = a.trade_date + a.entry_time; bv = b.trade_date + b.entry_time; }
      if (sortKey === "grade") { av = window.TradeGrade ? (window.TradeGrade.get(a) || 0) : 0; bv = window.TradeGrade ? (window.TradeGrade.get(b) || 0) : 0; }
      if (typeof av === "string") { av = av || ""; bv = bv || ""; return sortDir === "asc" ? av.localeCompare(bv) : bv.localeCompare(av); }
      av = av || 0; bv = bv || 0;
      return sortDir === "asc" ? av - bv : bv - av;
    });
    tableRows = sorted;
    lastSortedRows = sorted;
    tableShown = Math.min(bootShown != null ? bootShown : TABLE_PAGE_SIZE, sorted.length);
    bootShown = null; // one-time restore -- any later filter/sort change resets to a normal first page
    syncUrlState();
    drawTable();
    if (smSnap && window.ScrollMemory) window.ScrollMemory.finish(smSnap); // no-op after the first draw
  }

  // Redraws the table from the already-filtered/sorted tableRows, at the
  // current scroll depth (tableShown) and selection, without re-filtering
  // or resetting to page 1. Used after a quick-edit save, a bulk action,
  // or a column-layout change (reorder/resize/KV sync).
  function redrawTable() { if (tableRows.length) drawTable(); }

  function rowHtml(r) {
    const colDefs = colDefsByOrder();
    const rowLabel = `View trade — ${r.trade_date} ${r.symbol}, ${r.win ? "win" : "loss"}, ${fmtMoney(r.pnl_after_comm || 0)}`;
    return `
      <tr data-id="${escapeHtml(r.id)}" class="row-link" tabindex="0" role="link" aria-label="${escapeHtml(rowLabel)}">
        <td class="checkbox-col"><input type="checkbox" class="row-cb" data-id="${escapeHtml(r.id)}" aria-label="Select trade" ${selectedIds.has(r.id) ? "checked" : ""}></td>
        ${colDefs.map((c) => `<td class="col-${c.id}">${c.render(r)}</td>`).join("")}
      </tr>`;
  }
  function loadMoreRowHtml() {
    const remaining = tableRows.length - tableShown;
    if (remaining <= 0) return "";
    return `<tr id="table-load-more-row"><td colspan="${colDefsByOrder().length + 1}" style="padding:14px 10px; text-align:center;">
      <button type="button" class="btn-load-more" id="table-load-more-btn">Load more (${remaining} left)</button>
    </td></tr>`;
  }
  function colgroupHtml() {
    return `<colgroup><col style="width:34px;">${colDefsByOrder().map((c) => `<col data-col-id="${c.id}" style="width:${colWidths[c.id]}px;">`).join("")}</colgroup>`;
  }
  function headerRowHtml() {
    const defs = colDefsByOrder();
    return `<tr>
      <th class="checkbox-col" scope="col"><input type="checkbox" id="select-all-cb" aria-label="Select all loaded trades"></th>
      ${defs.map((c, i) => {
        const isSorted = sortKey === c.id;
        const ariaSort = c.sortable ? ` aria-sort="${isSorted ? (sortDir === "asc" ? "ascending" : "descending") : "none"}"` : "";
        const headcell = c.sortable
          ? `<button type="button" class="headcell${isSorted ? " sorted " + sortDir : ""}" data-sort="${c.id}">${escapeHtml(c.label)}</button>`
          : `<span class="headcell no-sort">${escapeHtml(c.label)}</span>`;
        // Keyboard/screen-reader equivalent of the mouse-only drag-to-reorder
        // and drag-to-resize handles: same colOrder/colWidths state, same
        // persistence, just reachable without a pointer. Hidden until
        // hovered/focused so it doesn't visually clutter every header for
        // mouse users who already have drag.
        const kbdActions = `
          <div class="col-kbd-actions">
            <button type="button" data-move="left" data-col-id="${c.id}" aria-label="Move ${escapeHtml(c.label)} column left"${i === 0 ? " disabled" : ""}>‹</button>
            <button type="button" data-move="right" data-col-id="${c.id}" aria-label="Move ${escapeHtml(c.label)} column right"${i === defs.length - 1 ? " disabled" : ""}>›</button>
            <button type="button" data-resize="narrower" data-col-id="${c.id}" aria-label="Make ${escapeHtml(c.label)} column narrower">−</button>
            <button type="button" data-resize="wider" data-col-id="${c.id}" aria-label="Make ${escapeHtml(c.label)} column wider">+</button>
          </div>`;
        return `
        <th data-col-id="${c.id}" draggable="true" class="col-th" title="Drag to reorder" scope="col"${ariaSort}>
          ${headcell}
          <span class="col-resize-handle" data-col-id="${c.id}" title="Drag to resize"></span>
          ${kbdActions}
        </th>`;
      }).join("")}
    </tr>`;
  }

  function drawTable() {
    const totalPnl = tableRows.reduce((s, r) => s + (r.pnl_after_comm || 0), 0);
    const summaryInner = `${tableRows.length} trade${tableRows.length === 1 ? "" : "s"} · net <span class="${totalPnl >= 0 ? "up" : "down"}">${fmtMoney(totalPnl)}</span>`;
    content.innerHTML = `
      <div class="journal-sticky-bar" id="journal-sticky-bar" aria-hidden="true">${summaryInner}</div>
      <div class="panel-box" style="padding:0;">
        <div class="journal-table-head">
          <span id="journal-result-summary" aria-live="polite" aria-atomic="true">${summaryInner}</span>
          <label class="mobile-sort"><span>Sort</span>
            <select id="mobile-sort-select" class="select-clean" aria-label="Sort trades">
              ${ALL_COLUMNS.filter((c) => c.sortable).map((c) => ["desc", "asc"].map((d) => `<option value="${c.id}:${d}"${sortKey === c.id && sortDir === d ? " selected" : ""}>${escapeHtml(c.label)} ${d === "desc" ? "&#8595;" : "&#8593;"}</option>`).join("")).join("")}
            </select>
          </label>
          <span style="display:flex; gap:8px;">
            <button class="icon-btn icon-btn-visible" id="csv-export-btn" title="Export this filtered set as CSV, with a column picker" style="width:auto; padding:4px 10px; font-size:11.5px; gap:5px;">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:13px;height:13px;"><path d="M12 3v12"></path><path d="M7 10l5 5 5-5"></path><path d="M5 21h14"></path></svg>
              <span>Export CSV…</span>
            </button>
            <button class="icon-btn icon-btn-visible" id="share-view-btn" title="Export this filtered set as a shareable static page" style="width:auto; padding:4px 10px; font-size:11.5px; gap:5px;">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:13px;height:13px;"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.6" y1="13.5" x2="15.4" y2="17.5"></line><line x1="15.4" y1="6.5" x2="8.6" y2="10.5"></line></svg>
              <span id="share-view-label">Share this view</span>
            </button>
          </span>
        </div>
        <div class="bulk-toolbar" id="bulk-toolbar" style="display:none;">
          <span id="bulk-count">0 selected</span>
          <button type="button" class="filter-btn" id="bulk-tag-btn">Add tag…</button>
          <button type="button" class="filter-btn" id="bulk-export-btn">Export selected…</button>
          <button type="button" class="btn-danger" id="bulk-delete-btn" style="padding:6px 12px; font-size:12.5px;">Delete</button>
          <button type="button" class="filter-btn" id="bulk-clear-btn">Clear</button>
        </div>
        <div class="table-scroll">
        <table class="data-table journal-data-table" id="journal-table">
          ${colgroupHtml()}
          <thead>${headerRowHtml()}</thead>
          <tbody id="journal-tbody">
            ${tableRows.slice(0, tableShown).map(rowHtml).join("")}
            ${loadMoreRowHtml()}
          </tbody>
        </table>
        </div>
      </div>
    `;
    updateBulkToolbar();
  }

  // ------------------------------------------------------------------
  // Delegated event handling -- attached once to #journal-content, which
  // is a stable DOM node across every drawTable() call (only its
  // innerHTML is replaced), so this covers rows added later by "Load
  // more" and quick-edit panels injected after the fact without ever
  // needing to be re-wired.
  // ------------------------------------------------------------------
  content.addEventListener("click", (e) => {
    const moveBtn = e.target.closest("[data-move]");
    if (moveBtn) {
      const id = moveBtn.getAttribute("data-col-id");
      const dir = moveBtn.getAttribute("data-move");
      const from = colOrder.indexOf(id);
      const to = dir === "left" ? from - 1 : from + 1;
      if (from === -1 || to < 0 || to >= colOrder.length) return;
      colOrder.splice(from, 1);
      colOrder.splice(to, 0, id);
      saveColumnPrefs();
      redrawTable();
      // Redraw replaces the DOM, so the button that had focus is gone --
      // put focus back on its replacement (or the opposite-direction one,
      // if this move just landed the column at an edge) so a keyboard user
      // doesn't lose their place after each move.
      const restored = content.querySelector(`[data-move="${dir}"][data-col-id="${id}"]`)
        || content.querySelector(`[data-col-id="${id}"] .headcell`);
      if (restored) restored.focus();
      return;
    }
    const resizeBtn = e.target.closest("[data-resize]");
    if (resizeBtn) {
      const id = resizeBtn.getAttribute("data-col-id");
      const delta = resizeBtn.getAttribute("data-resize") === "wider" ? 20 : -20;
      colWidths[id] = Math.max(50, (colWidths[id] || 100) + delta);
      const colEl = content.querySelector(`col[data-col-id="${id}"]`);
      if (colEl) colEl.style.width = colWidths[id] + "px";
      saveColumnPrefs();
      return;
    }
    const sortHead = e.target.closest(".headcell[data-sort]");
    if (sortHead) {
      const key = sortHead.getAttribute("data-sort");
      if (sortKey === key) sortDir = sortDir === "asc" ? "desc" : "asc";
      else { sortKey = key; sortDir = "desc"; }
      applyFilters();
      return;
    }
    if (e.target.closest("#table-load-more-btn")) {
      const btn = e.target.closest("#table-load-more-btn");
      const nextShown = Math.min(tableShown + TABLE_PAGE_SIZE, tableRows.length);
      const newRowsHtml = tableRows.slice(tableShown, nextShown).map(rowHtml).join("");
      tableShown = nextShown;
      syncUrlState();
      const moreRow = document.getElementById("table-load-more-row");
      moreRow.insertAdjacentHTML("beforebegin", newRowsHtml);
      if (tableShown < tableRows.length) btn.textContent = `Load more (${tableRows.length - tableShown} left)`;
      else moreRow.remove();
      updateBulkToolbar();
      return;
    }
    if (e.target.closest("#empty-clear-filters")) {
      Object.values(els).forEach((el) => { if (el.type === "checkbox") el.checked = false; else el.value = ""; });
      document.getElementById("journal-filters").dispatchEvent(new Event("change")); // refresh the Filters badge
      applyFilters();
      return;
    }
    if (e.target.closest("#share-view-btn")) {
      if (!window.TradeLogShare) return;
      const label = document.getElementById("share-view-label");
      try {
        const html = TradeLogShare.buildSetSharePage(tableRows, {
          title: `${tableRows.length} trade${tableRows.length === 1 ? "" : "s"} — trade.log`,
          filtersSummary: describeFilters(),
        });
        TradeLogShare.download(`trade-log-filtered-${new Date().toISOString().slice(0, 10)}.html`, html);
        label.textContent = "Downloaded!";
        setTimeout(() => (label.textContent = "Share this view"), 1600);
      } catch (err) {
        label.textContent = "Couldn't export";
        setTimeout(() => (label.textContent = "Share this view"), 1600);
      }
      return;
    }
    if (e.target.closest("#csv-export-btn")) { openExportModal(tableRows); return; }
    if (e.target.closest("#bulk-export-btn")) { openExportModal(tableRows.filter((r) => selectedIds.has(r.id))); return; }
    if (e.target.closest("#bulk-clear-btn")) { selectedIds.clear(); redrawTable(); return; }
    if (e.target.closest("#bulk-tag-btn")) { bulkAddTag(); return; }
    if (e.target.closest("#bulk-delete-btn")) { bulkDelete(); return; }
    const quickEditBtn = e.target.closest("[data-quick-edit]");
    if (quickEditBtn) { openQuickEdit(quickEditBtn.getAttribute("data-quick-edit"), quickEditBtn.closest(".tags-cell")); return; }
    if (e.target.closest(".quick-edit-panel")) return; // swallow, handled by its own buttons below
    // Row navigation -- ignore clicks that landed on an interactive
    // control (checkbox, quick-edit button/panel) inside the row.
    const tr = e.target.closest("tr[data-id]");
    if (tr && !e.target.closest("input, button, .quick-edit-panel")) {
      if (window.ScrollMemory) window.ScrollMemory.saveNow();
      window.location.href = `trade.html?id=${encodeURIComponent(tr.getAttribute("data-id"))}`;
    }
  });

  // Swipe actions on a card (js/mobile-extras.js reports the intent; this page owns
  // what each one does): right swipe = Note, left swipe = Tag / Delete.
  content.addEventListener("journal:swipe", (e) => {
    const { id, action } = e.detail || {};
    if (!id) return;
    if (action === "delete") deleteIds([id]);
    else if (window.QuickAdd) window.QuickAdd.open({ mode: "trade", tradeId: id, focus: action === "tag" ? "tags" : null });
  });
  // A note/tag saved from the quick sheet shows up in the Tags column right away.
  const onNoteSaved = () => {
    if (!content.isConnected) { window.removeEventListener("tradelog:note-saved", onNoteSaved); return; }
    if (typeof populateJournalFilters === "function") populateJournalFilters();
    redrawTable();
  };
  window.addEventListener("tradelog:note-saved", onNoteSaved);

  // Reached a bare Journal (tab bar / drawer) while a filtered view from earlier
  // this session exists: offer to pick it back up instead of silently resetting it.
  // A chip rather than auto-applying, so a fresh visit never hides trades by surprise.
  (function resumeChip() {
    if (!lastView || location.search || (smSnap && smSnap.back)) return;
    if (!window.matchMedia || !window.matchMedia("(max-width: 760px)").matches) return;
    let q;
    try { q = new URLSearchParams(lastView.split("?")[1] || ""); } catch (e) { return; }
    const filters = ["symbol", "from", "to", "setup", "result", "rvol", "avgvol", "float", "tag", "grade", "flagged", "tfrom", "tto"]
      .filter((k) => q.get(k)).length;
    const sorted = !!(q.get("sort") || q.get("dir"));
    if (!filters && !sorted) return;
    const bits = [];
    if (filters) bits.push(filters + " filter" + (filters === 1 ? "" : "s"));
    if (sorted) bits.push("custom sort");
    const bar = document.createElement("div");
    bar.className = "journal-resume";
    bar.setAttribute("role", "status");
    bar.innerHTML = '<button type="button" class="jr-go">Resume your last view<span> · ' + bits.join(", ") + '</span></button>' +
      '<button type="button" class="jr-x" aria-label="Dismiss">\u2715</button>';
    content.parentNode.insertBefore(bar, content);
    const drop = () => { if (bar.parentNode) bar.parentNode.removeChild(bar); };
    bar.querySelector(".jr-x").addEventListener("click", drop);
    bar.querySelector(".jr-go").addEventListener("click", () => {
      if (window.ScrollMemory) window.ScrollMemory.markReturn("journal"); // also restores your scroll offset
      window.location.href = lastView;
    });
    const box = document.getElementById("journal-filters");
    if (box) { box.addEventListener("input", drop, { once: true }); box.addEventListener("change", drop, { once: true }); }
  })();

  // Pull down at the top to re-fetch trades in place -- filters, sort, and how far
  // down you'd loaded all stay as they are.
  if (window.PullRefresh) {
    window.PullRefresh.set(() => window.swrFetch("trades", window.fetchTradesIndex).then((rows) => {
      allRows = Array.isArray(rows) ? rows : [];
      bootShown = tableShown || null;
      applyFilters();
    }));
  }

  // Rows carry role="link" + tabindex so they're keyboard-reachable (see
  // rowHtml above); native <tr> elements don't fire "click" on Enter/Space
  // the way a real link or button would, so that has to be wired by hand.
  // Phones: the 13 filter controls live behind a "Filters" button so they
  // don't push the trades a full screen down; the button shows how many
  // are active so a hidden filter can't silently hide trades.
  (function initMobileFilters() {
    const box = document.getElementById("journal-filters");
    const btn = document.getElementById("filters-toggle");
    const count = document.getElementById("filters-toggle-count");
    if (!box || !btn) return;
    function refresh() {
      let n = 0;
      box.querySelectorAll("input, select").forEach((el) => {
        if (el.id === "f-symbol") return; // symbol stays visible, doesn't need a badge
        if (el.type === "checkbox" ? el.checked : !!el.value) n++;
      });
      count.textContent = n ? String(n) : "";
      btn.classList.toggle("has-active", n > 0);
    }
    function setOpen(open) {
      box.classList.toggle("open", open);
      btn.setAttribute("aria-expanded", open ? "true" : "false");
      try { sessionStorage.setItem("tl:journal:filters-open", open ? "1" : "0"); } catch (e) { /* ignore */ }
    }
    btn.addEventListener("click", () => setOpen(!box.classList.contains("open")));
    // Coming back from a trade? Keep the panel the way it was left.
    try { if (smSnap && smSnap.back && sessionStorage.getItem("tl:journal:filters-open") === "1") setOpen(true); } catch (e) { /* ignore */ }
    box.addEventListener("input", refresh);
    box.addEventListener("change", refresh);
    refresh();
    setTimeout(refresh, 600); // filters restored from the URL / saved state after load
  })();

  content.addEventListener("keydown", (e) => {
    if (e.key !== "Enter" && e.key !== " ") return;
    const tr = e.target.closest("tr[data-id]");
    if (tr && tr === e.target && !e.target.closest("input, button, .quick-edit-panel")) {
      e.preventDefault();
      if (window.ScrollMemory) window.ScrollMemory.saveNow();
      window.location.href = `trade.html?id=${encodeURIComponent(tr.getAttribute("data-id"))}`;
    }
  });

  content.addEventListener("change", (e) => {
    if (e.target.matches("#mobile-sort-select")) {
      const [key, dir] = e.target.value.split(":");
      sortKey = key; sortDir = dir;
      applyFilters();
      return;
    }
    if (e.target.matches(".row-cb")) {
      const id = e.target.getAttribute("data-id");
      if (e.target.checked) selectedIds.add(id); else selectedIds.delete(id);
      updateBulkToolbar();
      return;
    }
    if (e.target.matches("#select-all-cb")) {
      const shownIds = tableRows.slice(0, tableShown).map((r) => r.id);
      if (e.target.checked) shownIds.forEach((id) => selectedIds.add(id));
      else shownIds.forEach((id) => selectedIds.delete(id));
      content.querySelectorAll(".row-cb").forEach((cb) => { cb.checked = selectedIds.has(cb.getAttribute("data-id")); });
      updateBulkToolbar();
    }
  });

  // Column drag-to-reorder (native HTML5 DnD on the <th>s).
  let dragColId = null;
  content.addEventListener("dragstart", (e) => {
    const th = e.target.closest("th[data-col-id]");
    if (!th) return;
    dragColId = th.getAttribute("data-col-id");
    e.dataTransfer.effectAllowed = "move";
    try { e.dataTransfer.setData("text/plain", dragColId); } catch (err) { /* ignore */ }
  });
  content.addEventListener("dragover", (e) => {
    if (!dragColId) return;
    const th = e.target.closest("th[data-col-id]");
    if (th) e.preventDefault();
  });
  content.addEventListener("drop", (e) => {
    const th = e.target.closest("th[data-col-id]");
    if (!th || !dragColId) return;
    e.preventDefault();
    const targetId = th.getAttribute("data-col-id");
    if (targetId === dragColId) { dragColId = null; return; }
    const from = colOrder.indexOf(dragColId);
    const to = colOrder.indexOf(targetId);
    if (from === -1 || to === -1) { dragColId = null; return; }
    colOrder.splice(from, 1);
    colOrder.splice(to, 0, dragColId);
    dragColId = null;
    saveColumnPrefs();
    redrawTable();
  });

  // Column resize (drag the handle on the right edge of a header cell).
  // Adjusts just that column's <col> width live, and persists on mouseup
  // -- matches the sidebar's "instant + persisted" collapse behaviour.
  let resizing = null;
  content.addEventListener("mousedown", (e) => {
    const handle = e.target.closest(".col-resize-handle");
    if (!handle) return;
    e.preventDefault();
    const id = handle.getAttribute("data-col-id");
    resizing = { id, startX: e.clientX, startWidth: colWidths[id] };
  });
  document.addEventListener("mousemove", (e) => {
    if (!resizing) return;
    const w = Math.max(50, resizing.startWidth + (e.clientX - resizing.startX));
    colWidths[resizing.id] = w;
    const colEl = content.querySelector(`col[data-col-id="${resizing.id}"]`);
    if (colEl) colEl.style.width = w + "px";
  });
  document.addEventListener("mouseup", () => {
    if (!resizing) return;
    resizing = null;
    saveColumnPrefs();
  });

  function updateBulkToolbar() {
    const bar = document.getElementById("bulk-toolbar");
    if (!bar) return;
    const n = selectedIds.size;
    bar.style.display = n ? "" : "none";
    const countEl = document.getElementById("bulk-count");
    if (countEl) countEl.textContent = `${n} selected`;
    const selectAllCb = document.getElementById("select-all-cb");
    if (selectAllCb) {
      const shownIds = tableRows.slice(0, tableShown).map((r) => r.id);
      const allChecked = shownIds.length > 0 && shownIds.every((id) => selectedIds.has(id));
      selectAllCb.checked = allChecked;
      selectAllCb.indeterminate = !allChecked && shownIds.some((id) => selectedIds.has(id));
    }
  }

  // Inline quick-edit -- lets a trader add tags/a note to a trade right
  // from the journal row, without opening the full trade page. Writes
  // through trade-notes.js's existing per-trade entry (mistakes tags +
  // notes), the same writable store the trade page itself edits, so
  // nothing here bypasses or duplicates that data model.
  function openQuickEdit(id, cellEl) {
    if (!cellEl || !window.TradeNotes) return;
    const entry = window.TradeNotes.get(id) || {};
    const tagsStr = (entry.mistakes || []).join(", ");
    cellEl.innerHTML = `
      <span class="quick-edit-panel">
        <input type="text" class="quick-edit-tags" placeholder="tags, comma separated" value="${escapeHtml(tagsStr)}">
        <input type="text" class="quick-edit-note" placeholder="note" value="${escapeHtml(entry.notes || "")}">
        <button type="button" class="quick-edit-save" title="Save">&#10003;</button>
        <button type="button" class="quick-edit-cancel" title="Cancel">&#10005;</button>
      </span>`;
    const tagsInput = cellEl.querySelector(".quick-edit-tags");
    tagsInput.focus();
    tagsInput.setSelectionRange(tagsInput.value.length, tagsInput.value.length);
    cellEl.querySelector(".quick-edit-save").addEventListener("click", () => {
      const newTags = tagsInput.value.split(",").map((t) => t.trim()).filter(Boolean);
      const newNote = cellEl.querySelector(".quick-edit-note").value;
      window.TradeNotes.save(id, Object.assign({}, entry, { mistakes: newTags, notes: newNote }));
      if (window.Haptics) window.Haptics.play("success");
      redrawTable();
    });
    cellEl.querySelector(".quick-edit-cancel").addEventListener("click", () => redrawTable());
  }

  // Bulk tag -- adds one tag to every selected trade's trade-notes entry
  // (creating the entry if the trade doesn't have one yet).
  async function bulkAddTag() {
    if (!selectedIds.size || !window.TradeNotes) return;
    const tag = window.UIModal
      ? await UIModal.prompt(`Add a tag to ${selectedIds.size} selected trade${selectedIds.size === 1 ? "" : "s"}:`, "", { title: "Bulk tag", confirmLabel: "Add" })
      : prompt("Tag to add:", "");
    if (!tag || !tag.trim()) return;
    const clean = tag.trim();
    selectedIds.forEach((id) => {
      const entry = window.TradeNotes.get(id) || {};
      const mistakes = Array.from(new Set((entry.mistakes || []).concat([clean])));
      window.TradeNotes.save(id, Object.assign({}, entry, { mistakes }));
    });
    redrawTable();
  }

  // Bulk delete -- removes the selected trades from Supabase directly
  // (RLS already scopes `trades` to the signed-in user, same client used
  // everywhere else on this page). Assumes trade_details cascades on
  // trade_id -- if it doesn't in your schema, add that FK/ON DELETE
  // CASCADE, or delete from trade_details here too before this call.
  //
  // Optimistic + undoable: the rows disappear from the table the instant
  // you click Delete (no blocking "are you sure?" -- that's what the
  // Undo toast is for), but the actual Supabase delete is deferred until
  // the toast expires. Clicking Undo within that window just restores
  // the rows locally and the server call never happens; letting it run
  // out fires the real delete, with the old rollback-on-failure kept as
  // a fallback for the rare case that call itself errors.
  function bulkDelete() {
    if (!selectedIds.size) return;
    deleteIds(Array.from(selectedIds));
  }
  // Shared by the bulk toolbar and the swipe-left "Delete" on a card.
  function deleteIds(ids) {
    if (!ids.length) return;
    const n = ids.length;
    const idSet = new Set(ids);
    const removed = [];
    ids.forEach((id) => {
      const idx = allRows.findIndex((r) => r.id === id);
      if (idx !== -1) removed.push({ row: allRows[idx], index: idx });
    });
    if (window.Haptics) window.Haptics.play("warn");
    allRows = allRows.filter((r) => !idSet.has(r.id));
    ids.forEach((id) => selectedIds.delete(id));
    bootShown = tableShown || null; // keep the list as far down as it was
    applyFilters();

    const restore = () => {
      removed.sort((a, b) => a.index - b.index).forEach(({ row, index }) => {
        allRows.splice(Math.min(index, allRows.length), 0, row);
      });
      bootShown = tableShown || null;
      applyFilters();
    };

    const label = `Deleted ${n} trade${n === 1 ? "" : "s"}`;
    if (!window.showToast) {
      // No toast support (shouldn't happen -- utils.js loads on every
      // page) -- fall back to the old blocking confirm so a delete is
      // never silently unrecoverable-and-un-warned-about.
      if (!confirm(`Delete ${n} trade(s)? This can't be undone.`)) { restore(); return; }
      commit();
      return;
    }
    window.showToast(label + " — Undo", {
      action: { label: "Undo", onClick: restore },
      onExpire: commit,
    });

    async function commit() {
      try {
        const res = await window.sb.from("trades").delete().in("id", ids);
        if (res.error) throw new Error(res.error.message);
      } catch (err) {
        restore();
        if (window.UIModal) UIModal.alert("Couldn't delete: " + err.message, { tone: "danger" });
        else alert("Couldn't delete: " + err.message);
      }
    }
  }

  // CSV export with a column picker -- replaces the old plain "whatever
  // was there" export with an explicit choice of which columns to include,
  // over either the current filtered view or just the selected rows.
  function csvEscape(v) {
    const s = String(v == null ? "" : v);
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }
  function buildCsv(rows, columnIds) {
    const defs = columnIds.map((id) => EXPORT_COLUMNS.find((c) => c.id === id)).filter(Boolean);
    const header = defs.map((d) => csvEscape(d.label)).join(",");
    const lines = rows.map((r) => defs.map((d) => csvEscape(d.csv(r))).join(","));
    return [header].concat(lines).join("\r\n");
  }
  function downloadCsv(filename, csv) {
    const blob = new Blob(["\ufeff" + csv], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }
  function openExportModal(rows) {
    if (!rows.length) return;
    const overlay = document.createElement("div");
    overlay.className = "ui-modal-overlay";
    overlay.innerHTML = `
      <div class="ui-modal-box export-modal-box" role="dialog" aria-modal="true">
        <div class="ui-modal-title">Export ${rows.length} trade${rows.length === 1 ? "" : "s"} to CSV</div>
        <div class="export-col-picker">
          ${ALL_COLUMNS.map((c) => `<label class="export-col-row"><input type="checkbox" value="${c.id}" checked> ${escapeHtml(c.label)}</label>`).join("")}
          <div class="export-col-group" style="margin:10px 0 4px; font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--text-faint);">Your journal entries</div>
          ${JOURNAL_EXPORT_COLUMNS.map((c) => `<label class="export-col-row"><input type="checkbox" value="${c.id}" checked> ${escapeHtml(c.label)}</label>`).join("")}
        </div>
        <div class="ui-modal-actions">
          <button type="button" class="btn-advanced" data-act="cancel">Cancel</button>
          <button type="button" class="btn-confirm" data-act="export">Export CSV</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);
    requestAnimationFrame(() => overlay.classList.add("open"));
    function close() { overlay.classList.remove("open"); setTimeout(() => overlay.remove(), 160); }
    overlay.addEventListener("mousedown", (e) => { if (e.target === overlay) close(); });
    overlay.querySelector('[data-act="cancel"]').addEventListener("click", close);
    overlay.querySelector('[data-act="export"]').addEventListener("click", () => {
      const ids = Array.from(overlay.querySelectorAll(".export-col-picker input:checked")).map((cb) => cb.value);
      if (!ids.length) return;
      downloadCsv(`trade-log-export-${new Date().toISOString().slice(0, 10)}.csv`, buildCsv(rows, ids));
      close();
    });
  }

  // Turns the active filter controls into a plain-English summary line for
  // the exported page's header, e.g. "Setup: vwap reclaim · Aug 1–31, 2026
  // · Wins only" -- so whoever the page gets shared with knows what subset
  // of trades they're looking at without needing to see the journal UI.
  function describeFilters() {
    const parts = [];
    if (els.symbol.value.trim()) parts.push(`Symbol contains "${els.symbol.value.trim().toUpperCase()}"`);
    if (els.from.value || els.to.value) parts.push(`${els.from.value || "…"} – ${els.to.value || "…"}`);
    if (els.setup.value) parts.push(`Setup: ${els.setup.value.replace(/_/g, " ")}`);
    if (els.result.value === "win") parts.push("Wins only");
    if (els.result.value === "loss") parts.push("Losses only");
    if (els.rvol.value) parts.push(tagLabel(els.rvol.value));
    if (els.avgvol.value) parts.push(tagLabel(els.avgvol.value));
    if (els.float.value) parts.push(tagLabel(els.float.value));
    if (els.tag.value) parts.push(`Tag: ${els.tag.value.replace(/_/g, " ")}`);
    if (els.grade.value === "none") parts.push("Ungraded");
    else if (els.grade.value) parts.push(`${els.grade.value}★ & up`);
    if (els.timeFrom.value || els.timeTo.value) parts.push(`Entry ${els.timeFrom.value || "…"}–${els.timeTo.value || "…"}`);
    if (els.flagged.checked) parts.push("Has better entry/exit flagged");
    return parts.length ? parts.join(" · ") : "All trades, unfiltered";
  }
})();
