<!DOCTYPE html>
<html lang="en">
<head>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="auth.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Trading — trade.log</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="common.css">
<style>
  /* NOTE: paste your standard <aside class="sidebar">...</aside> nav block
     (same one journal.html / index.html use) in place of #sidebar-slot
     below -- kept out of this file so it doesn't drift from whatever you
     update it to elsewhere. */
  .lt-wrap { max-width: 980px; margin: 0 auto; padding: 28px 24px 60px; }
  .lt-form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 18px; }
  .lt-field { display: flex; flex-direction: column; gap: 6px; }
  .lt-field label { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--text-faint); font-weight: 600; }
  .lt-field input, .lt-field select {
    background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
    border-radius: 6px; padding: 8px 10px; font-size: 13.5px; font-family: var(--sans);
  }
  .lt-mode-banner {
    display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-radius: 6px;
    font-size: 12.5px; font-weight: 600; margin-bottom: 16px; border: 1px solid;
  }
  .lt-mode-banner.paper { background: var(--blue-soft); color: var(--blue); border-color: rgba(91,147,240,0.3); }
  .lt-mode-banner.live { background: var(--red-soft); color: var(--red); border-color: rgba(242,85,90,0.3); }
  .lt-actions { display: flex; gap: 10px; margin-top: 18px; }
  .lt-run-card { border-top: 1px solid var(--border-soft); padding-top: 14px; margin-top: 14px; }
  .lt-run-head { display: flex; align-items: center; justify-content: space-between; }
  .lt-run-head .title { font-family: var(--mono); font-size: 13px; }
  .lt-run-meta { color: var(--text-dim); font-size: 12px; margin-top: 2px; }
  .lt-positions { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 8px; }
  .lt-events { margin-top: 10px; font-family: var(--mono); font-size: 11.5px; color: var(--text-dim);
    max-height: 220px; overflow-y: auto; background: var(--panel-2); border-radius: 6px; padding: 10px 12px; }
  .lt-events div { padding: 2px 0; }
  .lt-empty { color: var(--text-faint); font-size: 13px; padding: 20px 0; text-align: center; }
</style>
</head>
<body>
  <div id="sidebar-slot"></div>

  <main class="lt-wrap">
    <div class="panel-head">
      <h1>Live Trading</h1>
      <div class="sub">Runs your backtested ORB strategies against IBKR in real time, via the live-service Docker stack on your own machine.</div>
    </div>

    <div id="lt-mode-banner" class="lt-mode-banner paper">PAPER — no real orders will be placed</div>

    <div class="card">
      <h2>Start a run</h2>
      <div class="lt-form-grid">
        <div class="lt-field">
          <label for="lt-symbols">Symbols (comma-separated)</label>
          <input id="lt-symbols" type="text" placeholder="MARA, SOFI">
        </div>
        <div class="lt-field">
          <label for="lt-mode">Mode</label>
          <select id="lt-mode">
            <option value="paper" selected>Paper</option>
            <option value="live">Live (real money)</option>
          </select>
        </div>
        <div class="lt-field">
          <label for="lt-entry-mode">Entry style</label>
          <select id="lt-entry-mode">
            <option value="orb_breakout">ORB breakout</option>
            <option value="red_candle_break">Red candle break</option>
            <option value="donchian_break">Donchian break</option>
            <option value="inside_bar_break">Inside bar break</option>
            <option value="vwap_reclaim">VWAP reclaim</option>
            <option value="ema_dip_reclaim" selected>EMA dip reclaim (9 EMA)</option>
            <option value="ema_reclaim">EMA reclaim</option>
            <option value="macd_bullish_cross">MACD bullish cross</option>
            <option value="rsi_oversold_bounce">RSI oversold bounce</option>
          </select>
        </div>
        <div class="lt-field">
          <label for="lt-stop-mode">Stop style</label>
          <select id="lt-stop-mode">
            <option value="pattern" selected>Pattern (entry style's natural stop)</option>
            <option value="fixed_cents">Fixed cents</option>
            <option value="fixed_pct">Fixed %</option>
            <option value="prior_bar_low">Prior bar low</option>
            <option value="atr_multiple">ATR multiple</option>
          </select>
        </div>
        <div class="lt-field">
          <label for="lt-target-r">Target (R multiple)</label>
          <input id="lt-target-r" type="number" step="0.1" value="2.0">
        </div>
        <div class="lt-field">
          <label for="lt-shares">Shares per trade</label>
          <input id="lt-shares" type="number" step="1" value="100">
        </div>
        <div class="lt-field">
          <label for="lt-max-loss">Max daily loss ($) — halts new entries once hit</label>
          <input id="lt-max-loss" type="number" step="10" value="200">
        </div>
        <div class="lt-field">
          <label for="lt-max-trades">Max trades/day per symbol</label>
          <input id="lt-max-trades" type="number" step="1" value="3">
        </div>
      </div>
      <div class="lt-actions">
        <button class="btn-confirm" id="lt-start-btn">Start run</button>
        <span id="lt-start-error" style="color: var(--red); font-size: 12.5px; align-self: center;"></span>
      </div>
    </div>

    <div class="card" style="margin-top: 18px;">
      <div class="panel-box-head">
        <div class="title">Active &amp; recent runs</div>
        <button class="link" id="lt-refresh-btn">Refresh</button>
      </div>
      <div id="lt-runs"><div class="lt-empty">No runs yet.</div></div>
    </div>
  </main>

<script src="live-trading.js"></script>
</body>
</html>
