  .tg-intro { font-size:14px; color:var(--text-dim); margin:0 0 14px; max-width:60ch; }
  .tg-tools { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin:0 0 10px; }
  .tg-tools input[type=search] { flex:1 1 200px; min-width:0; padding:9px 12px; border-radius:10px; border:1px solid var(--border); background:var(--panel-2); color:var(--text); font:inherit; }
  .tg-seg { display:inline-flex; padding:3px; gap:2px; border-radius:999px; border:1px solid var(--border); background:var(--panel-2); }
  .tg-seg button { font:inherit; font-size:12.5px; padding:6px 14px; border-radius:999px; border:0; background:transparent; color:var(--text-dim); cursor:pointer; }
  .tg-seg button.on { background:var(--primary-soft); color:var(--primary); }
  .tg-seg[hidden] { display:none; }
  .tg-key { display:flex; align-items:center; gap:10px; flex-wrap:wrap; font-size:12px; color:var(--text-faint); margin:0 0 16px; }
  .tg-note { font-size:12.5px; color:var(--text-dim); background:var(--panel-2); border-radius:10px; padding:8px 12px; margin-bottom:12px; }
  .tg-sec { background:var(--panel); border:1px solid var(--border); border-radius:14px; margin-bottom:12px; overflow:hidden; }
  .tg-sechead { display:flex; align-items:center; gap:10px; width:100%; text-align:left; background:none; border:0; color:inherit; font:inherit; padding:13px 14px; cursor:pointer; }
  .tg-sechead .t { font-size:14.5px; font-weight:600; }
  .tg-sechead .b { font-size:12px; color:var(--text-faint); flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tg-sechead .c { font-size:12px; color:var(--text-faint); }
  .tg-chev { width:14px; height:14px; flex:none; color:var(--text-faint); transition:transform .15s ease; }
  .tg-sec.closed .tg-chev, .tg-row:not(.open) .tg-chev { transform:rotate(-90deg); }
  .tg-sec.closed .tg-rows { display:none; }
  .tg-row { border-top:1px solid var(--border-soft); scroll-margin-top:80px; }
  .tg-row.flash { background:var(--primary-soft); }
  .tg-rowbtn { display:grid; grid-template-columns:190px minmax(0,1fr) auto 14px; align-items:center; gap:4px 14px; width:100%; text-align:left; background:none; border:0; color:inherit; font:inherit; padding:10px 14px; cursor:pointer; }
  .tg-rowbtn:hover { background:var(--panel-2); }
  .tg-rowbtn .pill { justify-self:start; max-width:100%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; cursor:inherit; }
  .tg-sum { font-size:13px; color:var(--text-dim); min-width:0; }
  .tg-res { font-size:12.5px; font-variant-numeric:tabular-nums; display:flex; gap:8px; justify-content:flex-end; white-space:nowrap; min-width:92px; }
  .tg-res .n { color:var(--text-faint); } .tg-res .up { color:var(--green); } .tg-res .down { color:var(--red); } .tg-res .none { color:var(--text-faint); }
  .tg-bar { position:relative; height:8px; border-radius:99px; background:var(--panel-2); }
  .tg-bar::after { content:""; position:absolute; left:50%; top:-2px; bottom:-2px; width:1px; background:var(--border); }
  .tg-bar i { position:absolute; top:0; bottom:0; border-radius:99px; }
  .tg-detail { display:none; padding:2px 14px 14px; }
  .tg-row.open .tg-detail { display:block; }
  .tg-detail .k { font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--text-faint); font-weight:600; margin-bottom:3px; }
  .tg-detail p { margin:0 0 10px; font-size:13px; line-height:1.55; color:var(--text-dim); background:var(--panel-2); border-radius:9px; padding:9px 11px; }
  .tg-detail .stat { font-size:12.5px; color:var(--text-faint); font-variant-numeric:tabular-nums; }
  .tg-detail .up { color:var(--green); } .tg-detail .down { color:var(--red); }
  .tg-sub { font-size:12px; color:var(--text-faint); margin:18px 2px 8px; }
  .tg-empty { color:var(--text-faint); padding:24px 4px; }
  @media (max-width:700px) {
    .tg-rowbtn { grid-template-columns:minmax(0,1fr) auto 14px; }
    .tg-rowbtn .tg-sum, .tg-rowbtn .tg-bar { grid-column:1 / -1; grid-row:2; }
    .tg-sechead .b { display:none; }
  }
</style>

<script>
(function () {
  "use strict";
  const TC = window.TagCatalog;
  const host = document.getElementById("tags-content");
  let rows = [], query = "", view = "topic", metric = "avg", rankMax = 1;
  const openRows = new Set(), groupOpen = {};
  const ORDER = ["setup", "entry", "exit", "process", "size", "day", "session", "hold", "price", "context"];
  const SCORED = { setup: 1, entry: 1, exit: 1 };
  const CHEV = '<svg class="tg-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>';
  const money = (v) => (v < 0 ? "-$" : "+$") + Math.abs(v).toFixed(2);

  function resHtml(k) {
    const s = TC.statsFor(k);
    if (!s) return rows.length ? '<span class="none">none yet</span>' : "";
    const v = view === "rank" && metric === "net" ? s.net : s.avg;
    return `<span class="n">${s.n}</span><span class="${v >= 0 ? "up" : "down"}">${money(v)}</span>`;
  }
  function detailHtml(e) {
    const s = TC.statsFor(e.key);
    let stat = "";
    if (s) {
      stat = `${s.n} trade${s.n === 1 ? "" : "s"} · ${Math.round((s.wins / s.n) * 100)}% win · avg <span class="${s.avg >= 0 ? "up" : "down"}">${money(s.avg)}</span> · net <span class="${s.net >= 0 ? "up" : "down"}">${money(s.net)}</span>`;
      if (SCORED[e.group] && s.n < TC.MIN_N) stat += ` · colour needs ${TC.MIN_N}+ trades`;
    } else if (rows.length) stat = "None of your trades have this tag.";
    return `<div class="tg-detail"><div class="k">Exact rule</div><p>${escapeHtml(e.rule)}</p>${stat ? `<div class="stat">${stat}</div>` : ""}</div>`;
  }
  function rowHtml(e, bar) {
    const open = openRows.has(e.key);
    let mid = `<span class="tg-sum">${escapeHtml(e.summary)}</span>`;
    if (bar) {
      const c = TC.colorOf(e.key), s = TC.statsFor(e.key);
      let t = c ? (c.hue - 60) / 60 : 0;
      if (metric === "net" && s) t = Math.max(-1, Math.min(1, s.net / rankMax));
      const w = Math.abs(t) * 50, hue = Math.round(60 + 60 * t);
      mid = `<span class="tg-bar" title="${escapeHtml(e.summary)}"><i style="background:hsl(${hue} 70% 48%);${t >= 0 ? "left:50%;" : "right:50%;"}width:${w.toFixed(1)}%"></i></span>`;
    }
    return `<article class="tg-row${open ? " open" : ""}" id="tag-${escapeHtml(e.key)}" data-key="${escapeHtml(e.key)}">
      <button type="button" class="tg-rowbtn" aria-expanded="${open}">
        <span class="pill tagpill" data-tag-color="${escapeHtml(e.key)}">${escapeHtml(e.label)}</span>${mid}<span class="tg-res">${resHtml(e.key)}</span>${CHEV}
      </button>${detailHtml(e)}</article>`;
  }
  const matches = (e, q) => !q || (e.label + " " + e.key + " " + e.summary + " " + e.rule).toLowerCase().indexOf(q) !== -1;

  function renderTopic(q) {
    const all = TC.all().filter((e) => matches(e, q));
    if (!all.length) return '<div class="tg-empty">No tags match.</div>';
    const groups = TC.groups().slice().sort((a, b) => (ORDER.indexOf(a.id) + 1 || 99) - (ORDER.indexOf(b.id) + 1 || 99));
    return groups.map((g) => {
      const list = all.filter((e) => e.group === g.id);
      if (!list.length) return "";
      const open = q ? true : g.id in groupOpen ? groupOpen[g.id] : !!SCORED[g.id];
      return `<section class="tg-sec${open ? "" : " closed"}" data-group="${escapeHtml(g.id)}">
        <button type="button" class="tg-sechead" aria-expanded="${open}"><span class="t">${escapeHtml(g.label)}</span><span class="b">${escapeHtml(g.blurb)}</span><span class="c">${list.length}</span>${CHEV}</button>
        <div class="tg-rows">${list.map((e) => rowHtml(e, false)).join("")}</div></section>`;
    }).join("");
  }
  function renderRank(q) {
    if (!rows.length) return '<div class="tg-empty">Your trades are still loading, or you\'re signed out. Sign in to see how each tag has paid.</div>';
    const pool = TC.all().filter((e) => SCORED[e.group] && matches(e, q));
    const ranked = pool.filter((e) => TC.colorOf(e.key)).sort((a, b) => metric === "net" ? TC.statsFor(b.key).net - TC.statsFor(a.key).net : TC.statsFor(b.key).avg - TC.statsFor(a.key).avg);
    rankMax = Math.max(1, ...ranked.map((e) => Math.abs(TC.statsFor(e.key).net)));
    const thin = pool.filter((e) => !TC.colorOf(e.key) && TC.statsFor(e.key));
    const unseen = pool.length - ranked.length - thin.length;
    if (!pool.length) return '<div class="tg-empty">No tags match.</div>';
    return (ranked.length ? `<section class="tg-sec"><div class="tg-rows">${ranked.map((e) => rowHtml(e, true)).join("")}</div></section>`
        : `<div class="tg-empty">No entry or exit tag has ${TC.MIN_N}+ trades yet.</div>`) +
      (thin.length ? `<div class="tg-sub">Not enough trades yet (under ${TC.MIN_N})</div><section class="tg-sec"><div class="tg-rows">${thin.map((e) => rowHtml(e, false)).join("")}</div></section>` : "") +
      (unseen > 0 ? `<div class="tg-sub">${unseen} more entry/exit tag${unseen === 1 ? " hasn't" : "s haven't"} shown up in your trades.</div>` : "");
  }
  function render() {
    const q = query.trim().toLowerCase();
    document.getElementById("tg-metric").hidden = view !== "rank";
    host.innerHTML = view === "rank" ? renderRank(q) : renderTopic(q);
    TC.paint(host);
    jumpToHash();
  }

  host.addEventListener("click", (ev) => {
    const rb = ev.target.closest(".tg-rowbtn");
    if (rb) {
      const row = rb.closest(".tg-row"), k = row.dataset.key, on = !row.classList.contains("open");
      row.classList.toggle("open", on); rb.setAttribute("aria-expanded", on);
      on ? openRows.add(k) : openRows.delete(k);
      return;
    }
    const sh = ev.target.closest(".tg-sechead");
    if (sh) {
      const sec = sh.closest(".tg-sec"), on = sec.classList.contains("closed");
      sec.classList.toggle("closed", !on); sh.setAttribute("aria-expanded", on);
      groupOpen[sec.dataset.group] = on;
    }
  });

  // Linked from a tag sheet (tags.html#tag-<key>): open that tag's group and row, then scroll to it. The page
  // re-renders when your trades arrive, so keep re-aiming for the first few seconds.
  const loadedAt = Date.now();
  let hashKey = null;
  try { hashKey = location.hash.indexOf("#tag-") === 0 ? decodeURIComponent(location.hash.slice(5)) : null; } catch (e) { /* ignore */ }
  if (hashKey) { openRows.add(hashKey); const g = (TC.get(hashKey) || {}).group; if (g) groupOpen[g] = true; }
  function jumpToHash() {
    if (!hashKey || Date.now() - loadedAt > 4000) return;
    const el = document.getElementById("tag-" + hashKey);
    if (!el) return;
    el.scrollIntoView({ block: "center" }); el.classList.add("flash");
    setTimeout(() => el.classList.remove("flash"), 2000);
  }

  function legend() {
    document.getElementById("tg-legend").innerHTML = rows.length
      ? `${TC.legendHtml()}<span>Entry and exit tags only, by your average P&amp;L per trade (${TC.MIN_N}+ trades)</span>` : "";
  }
  function untaggedNote() {
    const n = rows.filter((r) => !Array.isArray(r.behavior_tags) || !r.behavior_tags.some((t) => String(t).indexOf("price_") === 0)).length;
    document.getElementById("tg-untagged").innerHTML = n
      ? `<div class="tg-note">${n} of ${rows.length} trades are missing the newest tags. Journal → <b>Tag my setups</b> fills them in.</div>` : "";
  }

  document.getElementById("tg-search").addEventListener("input", (e) => { query = e.target.value; render(); });
  document.getElementById("tg-view").addEventListener("click", (e) => {
    const b = e.target.closest("button[data-view]"); if (!b) return;
    view = b.dataset.view;
    document.querySelectorAll("#tg-view button").forEach((x) => x.classList.toggle("on", x === b));
    render();
  });

  document.getElementById("tg-metric").addEventListener("click", (e) => {
    const b = e.target.closest("button[data-metric]"); if (!b) return;
    metric = b.dataset.metric;
    document.querySelectorAll("#tg-metric button").forEach((x) => x.classList.toggle("on", x === b));
    render();
  });

  render();                                              // rules first, no waiting on the network
  TC.refresh().then((changed) => { if (changed) render(); });
  Promise.resolve(window.fetchTradesIndex ? window.fetchTradesIndex() : [])
    .then((r) => { rows = Array.isArray(r) ? r : []; TC.setTrades(rows); untaggedNote(); legend(); render(); })
    .catch(() => {});                                    // signed out or offline: the guide still works
})();
</script>
