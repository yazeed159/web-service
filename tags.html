  .tg-tools { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin:4px 0 14px; }
  .tg-tools input[type=search] { flex:1 1 220px; min-width:0; padding:9px 12px; border-radius:10px; border:1px solid var(--border); background:var(--panel-2); color:var(--text); font:inherit; }
  .tg-seg { display:flex; gap:6px; flex-wrap:wrap; }
  .tg-seg button { font:inherit; font-size:12.5px; padding:7px 12px; border-radius:999px; border:1px solid var(--border); background:var(--panel-2); color:var(--text-dim); cursor:pointer; }
  .tg-seg button.on { background:var(--primary-soft); color:var(--primary); border-color:transparent; }
  .tg-note { font-size:13px; color:var(--text-dim); background:var(--panel-2); border-radius:10px; padding:10px 12px; margin-bottom:14px; }
  .tg-group { margin:22px 0 8px; } .tg-group h2 { font-size:15px; margin:0; } .tg-group .tg-blurb { font-size:12.5px; color:var(--text-faint); margin-top:2px; }
  .tg-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(min(310px,100%),1fr)); gap:12px; }
  .tg-card { background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:13px 14px; scroll-margin-top:80px; }
  .tg-card.flash { outline:2px solid var(--primary); }
  .tg-head { display:flex; align-items:center; gap:8px; justify-content:space-between; flex-wrap:wrap; margin-bottom:6px; }
  .tg-tone { font-size:11.5px; color:var(--text-faint); }
  .tg-sum { font-size:14px; margin-bottom:8px; }
  .tg-rule { font-size:13px; line-height:1.5; color:var(--text-dim); background:var(--panel-2); border-radius:9px; padding:9px 11px; }
  .tg-rule b { display:block; font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--text-faint); margin-bottom:3px; font-weight:600; }
  .tg-stats { margin-top:9px; font-size:12.5px; color:var(--text-faint); font-variant-numeric:tabular-nums; }
  .tg-stats .up { color:var(--green); } .tg-stats .down { color:var(--red); }
  .tg-empty { color:var(--text-faint); padding:24px 4px; }

<script>
(function () {
  "use strict";
  const TC = window.TagCatalog;
  const host = document.getElementById("tags-content");
  let rows = [];
  let tone = "all", query = "";

  const money = (v) => (v < 0 ? "-$" : "+$") + Math.abs(v).toFixed(2);
  const pnlOf = (r) => (typeof r.pnl_after_comm === "number" ? r.pnl_after_comm : Number(r.pnl_after_comm) || 0);

  function matcher(e) {
    const k = e.key;
    if (e.group === "setup") return (r) => r.setup_type === k;
    if (k.indexOf("avgvol_") === 0) return (r) => r.avg_volume_tag === k;
    if (k.indexOf("rvol_") === 0) return (r) => r.rvol_tag === k;
    if (k.indexOf("float_") === 0) return (r) => r.float_tag === k;
    return (r) => Array.isArray(r.behavior_tags) && r.behavior_tags.indexOf(k) !== -1;
  }
  function statsHtml(e) {
    if (!rows.length) return "";
    const hit = rows.filter(matcher(e));
    if (!hit.length) return '<div class="tg-stats">None of your trades have this tag.</div>';
    const wins = hit.filter((r) => pnlOf(r) > 0).length;
    const net = hit.reduce((s, r) => s + pnlOf(r), 0), avg = net / hit.length;
    return `<div class="tg-stats">${hit.length} trade${hit.length === 1 ? "" : "s"} · ${Math.round((wins / hit.length) * 100)}% win · avg <span class="${avg >= 0 ? "up" : "down"}">${money(avg)}</span> · net <span class="${net >= 0 ? "up" : "down"}">${money(net)}</span></div>`;
  }

  function render() {
    const q = query.trim().toLowerCase();
    const tags = TC.all().filter((e) => (tone === "all" || e.tone === tone) &&
      (!q || (e.label + " " + e.key + " " + e.summary + " " + e.rule).toLowerCase().indexOf(q) !== -1));
    if (!tags.length) { host.innerHTML = '<div class="tg-empty">No tags match.</div>'; return; }
    host.innerHTML = TC.groups().map((g) => {
      const list = tags.filter((e) => e.group === g.id);
      if (!list.length) return "";
      return `<div class="tg-group"><h2>${escapeHtml(g.label)}</h2><div class="tg-blurb">${escapeHtml(g.blurb)}</div></div>
        <div class="tg-grid">${list.map((e) => `<article class="tg-card" id="tag-${escapeHtml(e.key)}">
          <div class="tg-head"><span class="pill tagpill tc-pill tc-${e.tone}" style="cursor:default;">${escapeHtml(e.label)}</span><span class="tg-tone">${escapeHtml(TC.TONE_TEXT[e.tone])}</span></div>
          <div class="tg-sum">${escapeHtml(e.summary)}</div>
          <div class="tg-rule"><b>Exact criteria</b>${escapeHtml(e.rule)}</div>
          ${statsHtml(e)}</article>`).join("")}</div>`;
    }).join("");
    jumpToHash();
  }
  // The page re-renders when the live criteria / your trades arrive, so keep re-aiming at the linked
  // tag for the first few seconds instead of only once.
  const loadedAt = Date.now();
  function jumpToHash() {
    if (!location.hash || Date.now() - loadedAt > 4000) return;
    const el = document.getElementById(decodeURIComponent(location.hash.slice(1)));
    if (!el) return;
    el.scrollIntoView({ block: "center" }); el.classList.add("flash");
    setTimeout(() => el.classList.remove("flash"), 2200);
  }

  function untaggedNote() {
    const n = rows.filter((r) => !Array.isArray(r.behavior_tags) || !r.behavior_tags.some((t) => String(t).indexOf("price_") === 0)).length;
    document.getElementById("tg-untagged").innerHTML = n
      ? `<div class="tg-note">${n} of your ${rows.length} trades haven't been tagged with the newest tags yet. Open the Journal and tap <b>Tag my setups</b> to fill them in; the numbers below grow as you do.</div>` : "";
  }

  document.getElementById("tg-search").addEventListener("input", (e) => { query = e.target.value; render(); });
  document.getElementById("tg-tone").addEventListener("click", (e) => {
    const b = e.target.closest("button[data-tone]"); if (!b) return;
    tone = b.dataset.tone;
    document.querySelectorAll("#tg-tone button").forEach((x) => x.classList.toggle("on", x === b));
    render();
  });

  render();                                              // criteria first, no waiting on the network
  TC.refresh().then((changed) => { if (changed) render(); });
  Promise.resolve(window.fetchTradesIndex ? window.fetchTradesIndex() : [])
    .then((r) => { rows = Array.isArray(r) ? r : []; untaggedNote(); render(); })
    .catch(() => {});                                    // signed out or offline: the guide still works
})();
</script>
