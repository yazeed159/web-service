      </div>
      <div class="topbar-right">

          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
        </button>

    </header>

    <div class="content">
      <div class="panel-head">
        <div class="sub">Rolled up from every published trade in <span class="mono">data/trades.json</span>.</div>
      </div>

      <div id="stats-content">
        <div class="loading-line">Loading…</div>
      </div>
    </div>

    <div class="footer">trade.log — generated from data/trades.json</div>
  </div>
</div>

<script>
(function () {
  "use strict";

  const content = document.getElementById("stats-content");

  fetch("data/trades.json")
    .then((r) => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then((rows) => render(Array.isArray(rows) ? rows : []))
    .catch((err) => {
      content.innerHTML = `<div class="empty-state">Couldn't load data/trades.json (${escapeHtml(String(err.message))}). This page needs the trades index published by the pipeline.</div>`;
    });

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }
  function fmtMoney(v) {
    const sign = v >= 0 ? "+" : "-";
    return sign + "$" + Math.abs(v).toFixed(2);
  }

  function render(rows) {
    if (!rows.length) {
      content.innerHTML = `<div class="empty-state">No trades published yet.</div>`;
      return;
    }
    const sorted = rows.slice().sort((a, b) => (a.trade_date + a.entry_time).localeCompare(b.trade_date + b.entry_time));

    const totalPnl = sorted.reduce((s, r) => s + (r.pnl_after_comm || 0), 0);
    const wins = sorted.filter((r) => r.win).length;
    const winRate = Math.round((wins / sorted.length) * 1000) / 10;
    const avgWin = avg(sorted.filter((r) => r.win).map((r) => r.pnl_after_comm));
    const avgLoss = avg(sorted.filter((r) => !r.win).map((r) => r.pnl_after_comm));

    content.innerHTML = `
      <div class="stat-grid" style="margin-bottom:18px;">
        <div class="stat">
          <div class="label-row"><span class="label">Net P&amp;L</span></div>
          <div class="value ${totalPnl >= 0 ? "up" : "down"}">${fmtMoney(totalPnl)}</div>
          <div class="sub-value">${sorted.length} trades</div>
        </div>
        <div class="stat">
          <div class="label-row"><span class="label">Win Rate</span></div>
          <div class="value">${winRate}%</div>
          <div class="sub-value">${wins}W / ${sorted.length - wins}L</div>
        </div>
        <div class="stat">
          <div class="label-row"><span class="label">Avg Win / Loss</span></div>
          <div class="value"><span class="up">${fmtMoney(avgWin)}</span> <span style="color:var(--text-faint)">/</span> <span class="down">${fmtMoney(avgLoss)}</span></div>
        </div>
        <div class="stat" id="streak-cell">
          <div class="label-row"><span class="label">Current Streak</span></div>
          <div class="value">—</div>
        </div>
      </div>

      <div class="panel-box" style="margin-bottom:16px;">
        <div class="panel-box-head"><span class="title">Equity Curve</span></div>
        <div id="equity-chart" style="height:260px;"></div>
      </div>

      <div class="panel-box" style="margin-bottom:16px;">
        <div class="panel-box-head"><span class="title">Win Rate by Setup</span></div>
        <div id="setup-breakdown"></div>
      </div>

      <div class="panel-box" style="margin-bottom:16px;">
        <div class="panel-box-head"><span class="title">Money Left on the Table</span></div>
        <p style="color:var(--text-faint); font-size:12px; margin-top:-8px;">Sum of (suggested better price − actual fill) × shares, across every trade with a flagged better entry/exit.</p>
        <div id="slippage-breakdown"></div>
      </div>

      <div class="panel-box" style="margin-bottom:16px;">
        <div class="panel-box-head"><span class="title">Slippage Trend</span></div>
        <p style="color:var(--text-faint); font-size:12px; margin-top:-8px;">Cumulative money left on the table over time — climbing means it's getting worse, flattening means fills are getting closer to the suggested price.</p>
        <div id="slippage-trend-chart" style="height:220px;"></div>
      </div>

      <div class="panel-box" style="margin-bottom:16px;">
        <div class="panel-box-head"><span class="title">Slippage by Setup</span></div>
        <p style="color:var(--text-faint); font-size:12px; margin-top:-8px;">Which setups are costing the most in chased entries and early/late exits.</p>
        <div id="slippage-by-setup"></div>
      </div>
    `;

    renderEquityCurve(sorted);
    renderStreak(sorted);
    renderSetupBreakdown(sorted);
    renderSlippage(sorted);
    renderSlippageTrend(sorted);
    renderSlippageBySetup(sorted);
  }

  function avg(arr) {
    if (!arr.length) return 0;
    return arr.reduce((s, v) => s + v, 0) / arr.length;
  }

  function renderEquityCurve(sorted) {
    const el = document.getElementById("equity-chart");
    const chart = LightweightCharts.createChart(el, {
      width: el.clientWidth,
      height: 260,
      layout: { background: { color: "transparent" }, textColor: "#8b8fa3" },
      grid: { vertLines: { color: "#1b1e26" }, horzLines: { color: "#1b1e26" } },
      rightPriceScale: { borderColor: "#262a34" },
      timeScale: { borderColor: "#262a34" },
    });
    const series = chart.addAreaSeries({
      lineColor: "#5b93f0", topColor: "rgba(91,147,240,0.28)", bottomColor: "rgba(91,147,240,0.02)", lineWidth: 2,
    });
    // equity_after is already computed by the pipeline; fall back to a
    // running sum if an older index entry is missing it. Lightweight-charts
    // needs one strictly-increasing time key per point, but a day can have
    // several trades, so collapse same-day trades to that day's final
    // equity value.
    let running = 0;
    const byDate = new Map();
    for (const r of sorted) {
      running += r.pnl_after_comm || 0;
      const value = typeof r.equity_after === "number" ? r.equity_after : running;
      byDate.set(r.trade_date, value);
    }
    const data = Array.from(byDate.entries())
      .sort((a, b) => a[0].localeCompare(b[0]))
      .map(([time, value]) => ({ time, value }));
    series.setData(data);
    chart.timeScale().fitContent();
    window.addEventListener("resize", () => chart.applyOptions({ width: el.clientWidth }));
  }

  function renderStreak(sorted) {
    let current = 0, currentType = null, longestWin = 0, longestLoss = 0, run = 0, runType = null;
    for (const r of sorted) {
      const t = r.win ? "win" : "loss";
      if (t === runType) run += 1; else { runType = t; run = 1; }
      if (t === "win") longestWin = Math.max(longestWin, run); else longestLoss = Math.max(longestLoss, run);
    }
    // current streak = trailing run at the end of the sorted list
    for (let i = sorted.length - 1; i >= 0; i--) {
      const t = sorted[i].win ? "win" : "loss";
      if (currentType === null) { currentType = t; current = 1; }
      else if (t === currentType) current += 1;
      else break;
    }
    const cell = document.getElementById("streak-cell");
    cell.innerHTML = `
      <div class="label-row"><span class="label">Current Streak</span></div>
      <div class="value ${currentType === "win" ? "up" : "down"}">${current} ${currentType === "win" ? "W" : "L"}</div>
      <div class="sub-value">Longest: ${longestWin}W · ${longestLoss}L</div>
    `;
  }

  function renderSetupBreakdown(sorted) {
    const groups = {};
    for (const r of sorted) {
      const key = r.setup_type || "unlabeled";
      groups[key] = groups[key] || [];
      groups[key].push(r);
    }
    const el = document.getElementById("setup-breakdown");
    const entries = Object.entries(groups).sort((a, b) => b[1].length - a[1].length);
    el.innerHTML = entries.map(([setup, trades]) => {
      const wins = trades.filter((r) => r.win).length;
      const rate = Math.round((wins / trades.length) * 1000) / 10;
      const pnl = trades.reduce((s, r) => s + (r.pnl_after_comm || 0), 0);
      return `<div class="bar-row">
        <div class="bar-label">${escapeHtml(setup.replace(/_/g, " "))}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${rate}%; background:${rate >= 50 ? "var(--green)" : "var(--red)"};"></div></div>
        <div class="bar-count">${rate}%</div>
        <div style="width:90px; text-align:right; flex-shrink:0; color:${pnl >= 0 ? "var(--green)" : "var(--red)"};">${fmtMoney(pnl)}</div>
        <div style="width:60px; text-align:right; flex-shrink:0; color:var(--text-faint);">${trades.length}x</div>
      </div>`;
    }).join("") || `<div class="empty-state small">No setup_type data yet.</div>`;
  }

  function renderSlippage(sorted) {
    let entrySlip = 0, exitSlip = 0, entryCount = 0, exitCount = 0;
    for (const r of sorted) {
      const sign = (r.side === "short") ? -1 : 1;
      if (typeof r.better_entry_price === "number") {
        entrySlip += (r.entry_price - r.better_entry_price) * r.shares * sign;
        entryCount += 1;
      }
      if (typeof r.better_exit_price === "number") {
        exitSlip += (r.better_exit_price - r.exit_price) * r.shares * sign;
        exitCount += 1;
      }
    }
    const el = document.getElementById("slippage-breakdown");
    el.innerHTML = `
      <div class="stat-grid" style="margin-bottom:0;">
        <div class="stat">
          <div class="label-row"><span class="label">On Entries</span></div>
          <div class="value ${entrySlip <= 0 ? "up" : "down"}">${fmtMoney(-entrySlip)}</div>
          <div class="sub-value">across ${entryCount} flagged entries</div>
        </div>
        <div class="stat">
          <div class="label-row"><span class="label">On Exits</span></div>
          <div class="value ${exitSlip <= 0 ? "up" : "down"}">${fmtMoney(-exitSlip)}</div>
          <div class="sub-value">across ${exitCount} flagged exits</div>
        </div>
        <div class="stat">
          <div class="label-row"><span class="label">Total</span></div>
          <div class="value ${(-(entrySlip + exitSlip)) >= 0 ? "up" : "down"}">${fmtMoney(-(entrySlip + exitSlip))}</div>
          <div class="sub-value">what better fills would have added</div>
        </div>
      </div>
    `;
  }

  // Per-trade slippage cost, same sign convention as renderSlippage's
  // aggregate entrySlip/exitSlip: positive = money left on the table
  // (actual fill was worse than the LLM's suggested better price).
  // Trades with no better_entry_price/better_exit_price flagged contribute 0.
  function tradeSlipCost(r) {
    const sign = (r.side === "short") ? -1 : 1;
    let cost = 0;
    if (typeof r.better_entry_price === "number") cost += (r.entry_price - r.better_entry_price) * r.shares * sign;
    if (typeof r.better_exit_price === "number") cost += (r.better_exit_price - r.exit_price) * r.shares * sign;
    return cost;
  }
  function hasFlagged(r) {
    return typeof r.better_entry_price === "number" || typeof r.better_exit_price === "number";
  }

  function renderSlippageTrend(sorted) {
    const el = document.getElementById("slippage-trend-chart");
    const flagged = sorted.filter(hasFlagged);
    if (!flagged.length) {
      el.innerHTML = `<div class="empty-state small">No better-entry/exit flags yet.</div>`;
      return;
    }
    const chart = LightweightCharts.createChart(el, {
      width: el.clientWidth,
      height: 220,
      layout: { background: { color: "transparent" }, textColor: "#8b8fa3" },
      grid: { vertLines: { color: "#1b1e26" }, horzLines: { color: "#1b1e26" } },
      rightPriceScale: { borderColor: "#262a34" },
      timeScale: { borderColor: "#262a34" },
    });
    const series = chart.addAreaSeries({
      lineColor: "#e8a94c", topColor: "rgba(232,169,76,0.25)", bottomColor: "rgba(232,169,76,0.02)", lineWidth: 2,
    });
    // Same day-collapsing approach as the equity curve: lightweight-charts
    // needs one strictly-increasing time key, and several trades can share
    // a trade_date.
    let running = 0;
    const byDate = new Map();
    for (const r of sorted) {
      running += -tradeSlipCost(r); // display convention: positive = money captured, not lost
      byDate.set(r.trade_date, running);
    }
    const data = Array.from(byDate.entries()).sort((a, b) => a[0].localeCompare(b[0])).map(([time, value]) => ({ time, value }));
    series.setData(data);
    chart.timeScale().fitContent();
    window.addEventListener("resize", () => chart.applyOptions({ width: el.clientWidth }));
  }

  function renderSlippageBySetup(sorted) {
    const el = document.getElementById("slippage-by-setup");
    const flagged = sorted.filter(hasFlagged);
    if (!flagged.length) {
      el.innerHTML = `<div class="empty-state small">No better-entry/exit flags yet.</div>`;
      return;
    }
    const groups = {};
    for (const r of flagged) {
      const key = r.setup_type || "unlabeled";
      groups[key] = groups[key] || [];
      groups[key].push(r);
    }
    const entries = Object.entries(groups)
      .map(([setup, rows]) => [setup, rows, rows.reduce((s, r) => s + tradeSlipCost(r), 0)])
      .sort((a, b) => b[2] - a[2]); // worst (most left on the table) first
    const maxAbs = Math.max(1, ...entries.map(([, , cost]) => Math.abs(cost)));

    el.innerHTML = entries.map(([setup, rows, cost]) => {
      const pct = Math.round((Math.abs(cost) / maxAbs) * 100);
      const color = cost <= 0 ? "var(--green)" : "var(--red)";
      return `<div class="bar-row">
        <div class="bar-label">${escapeHtml(setup.replace(/_/g, " "))}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${pct}%; background:${color};"></div></div>
        <div style="width:70px; text-align:right; flex-shrink:0; color:${color};">${fmtMoney(-cost)}</div>
        <div style="width:60px; text-align:right; flex-shrink:0; color:var(--text-faint);">${rows.length}x</div>
      </div>`;
    }).join("");
  }

})();
</script>
<script>
  const sidebarBackdrop = document.createElement("div");
  sidebarBackdrop.className = "sidebar-backdrop";
  document.body.appendChild(sidebarBackdrop);
  function closeMobileNav() { document.getElementById("sidebar").classList.remove("mobile-open"); }
  sidebarBackdrop.addEventListener("click", closeMobileNav);
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeMobileNav(); });

  document.getElementById("sidebar-toggle").addEventListener("click", () => {
    const sidebar = document.getElementById("sidebar");
    if (window.innerWidth <= 760 && sidebar.classList.contains("mobile-open")) {
      closeMobileNav();
    } else {
      sidebar.classList.toggle("collapsed");
    }
  });
  document.getElementById("mobile-nav-btn").addEventListener("click", () => {
    document.getElementById("sidebar").classList.toggle("mobile-open");
  });
</script>
<script src="modern.js"></script>
</body>
