<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>trade.log — detail</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="css/common.css">
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js" defer></script>
</head>
<body>
<div id="page-progress-bar"></div>
<div id="page-loader-overlay" aria-hidden="true">
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <linearGradient id="page-loader-ring-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#8b7cf6"/>
        <stop offset="100%" stop-color="#22d3ee"/>
      </linearGradient>
    </defs>
  </svg>
  <div class="page-loader-mark">
    <span>T</span>
    <svg class="page-loader-ring" viewBox="0 0 78 78"><circle cx="39" cy="39" r="31"></circle></svg>
  </div>
</div>
<script src="js/page-transition.js"></script>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="modernGaugeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8457ff"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="modernEquityGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8457ff"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
</svg>


<div class="app-shell">

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-top">
      <a href="index.html" class="brand">
        <span class="mark">T</span>
        <span class="name">trade<span class="muted">.log</span></span>
      </a>
      <button class="sidebar-toggle" id="sidebar-toggle" title="Collapse sidebar" aria-label="Collapse sidebar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
      </button>
    </div>

    <nav class="sidebar-nav">
      <div id="sidebar-main-section"></div>


      <div id="sidebar-more-section"></div>
<script src="js/nav-render.js"></script>
</nav>

    <div class="sidebar-bottom">
      <div class="pipeline-status"><span class="dot"></span><span>Trade detail</span></div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="topbar-left">
        <h1 id="page-title">Trade detail</h1>
      </div>
      <div class="topbar-right">
        <button class="icon-btn" id="mobile-nav-btn" title="Menu" aria-label="Open menu">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
        </button>
      </div>
    </header>

    <div class="content">
      <div style="display:flex; align-items:center; justify-content:space-between; gap:12px;">
        <a href="journal.html" class="back-link">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
          All trades
        </a>
        <button class="icon-btn icon-btn-visible" id="share-trade-btn" title="Export this trade as a shareable static page" style="width:auto; padding:5px 12px; font-size:12px; gap:6px;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.6" y1="13.5" x2="15.4" y2="17.5"></line><line x1="15.4" y1="6.5" x2="8.6" y2="10.5"></line></svg>
          <span id="share-trade-label">Share trade</span>
        </button>
      </div>

      <div id="trade-content">
        <div class="loading-line">Loading trade…</div>
      </div>
    </div>

    <div class="footer">trade.log — chart renders client-side from this trade's <span class="mono">bars</span> array</div>
  </div>
</div>

<script src="js/utils.js"></script>
<script src="js/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/auth.js"></script>
<script src="js/grade.js"></script>
<script src="js/chart-indicators.js"></script>
<script src="js/share-export.js"></script>
<script src="js/trade.js"></script>
<script src="js/common.js"></script>
<script src="js/global-search.js"></script>
</body>
</html>
